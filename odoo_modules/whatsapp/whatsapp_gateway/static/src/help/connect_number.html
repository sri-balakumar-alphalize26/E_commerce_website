<html lang="en" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect and look after numbers</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e3e6ea;
  --brand: #714b67; --brand-ink: #ffffff; --accent: #017e84; --screen: #fbfbfc; --chip: #eef0f3;
  --ok: #1e8e3e; --ok-bg: #e6f4ea; --warn-bg: #fff4e5; --warn-ink: #8a4b00; --ring: rgba(1,126,132,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --card: #1e2128; --ink: #e8eaee; --muted: #9aa1ad; --line: #2f343d;
    --brand: #a27a98; --brand-ink: #15171c; --accent: #3fb5ba; --screen: #23262e; --chip: #2a2e36;
    --ok: #5bd17d; --ok-bg: #173523; --warn-bg: #3a2a12; --warn-ink: #ffcf8a; --ring: rgba(63,181,186,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --card: #1e2128; --ink: #e8eaee; --muted: #9aa1ad; --line: #2f343d;
  --brand: #a27a98; --brand-ink: #15171c; --accent: #3fb5ba; --screen: #23262e; --chip: #2a2e36;
  --ok: #5bd17d; --ok-bg: #173523; --warn-bg: #3a2a12; --warn-ink: #ffcf8a; --ring: rgba(63,181,186,.35);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: min(1280px, 100%); margin: 0 auto; padding: 20px 16px 40px; }
.vid { text-decoration: none; display: inline-block; }
.full { margin-left: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
/* full screen: the card fills the screen, the screenshot as large as it fits */
.card:fullscreen { overflow: auto; border-radius: 0; display: flex; flex-direction: column; }
.card:fullscreen .slide { flex: 1; display: flex; flex-direction: column; }
.card:fullscreen .screen { flex: 1; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
.tab[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.play { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.count { color: var(--muted); font-size: 13px; white-space: nowrap; }
.title { font-size: 18px; font-weight: 600; margin: 0; }
.text { padding: 6px 16px 12px; margin: 0; }
.text b { color: var(--accent); }
.screen { margin: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--screen); position: relative; overflow: hidden; min-height: 220px; }
.bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--chip); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.url { flex: 1; margin-left: 6px; background: var(--card); border-radius: 6px; padding: 3px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { padding: 14px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 14px; }
.row .val { color: var(--muted); font-size: 13px; text-align: right; }
.row.ghost { opacity: .55; }
.row.okrow { background: var(--ok-bg); border-color: transparent; color: var(--ok); font-weight: 600; justify-content: flex-start; }
.btn { display: inline-block; padding: 6px 14px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
.input { flex: 1; max-width: 62%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--muted); background: var(--screen); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.typing::after { content: '|'; animation: blink 1s steps(1) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.secret { font-family: ui-monospace, Consolas, monospace; letter-spacing: 2px; font-size: 16px; }
.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.qr { width: 92px; height: 92px; margin: 4px auto; background:
  conic-gradient(var(--ink) 0 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0) 0 0/18px 18px; border: 6px solid var(--card); outline: 1px solid var(--line); }
.target { position: relative; box-shadow: 0 0 0 3px var(--ring); animation: pulse 1.6s ease-in-out infinite; }
/* a real screenshot: the highlight sits on the exact button */
.shot { position: relative; line-height: 0; background: #fff; width: fit-content; max-width: 100%; margin: 0 auto; }
.shot img { width: auto; max-width: 100%; height: auto; display: block; cursor: zoom-in; }
.shot .hl { position: absolute; border: 3px solid #e8590c; border-radius: 7px; box-sizing: content-box;
  margin: -6px 0 0 -6px; padding: 3px; animation: hl 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes hl { 0%,100% { box-shadow: 0 0 0 3px rgba(232,89,12,.25); } 50% { box-shadow: 0 0 0 10px rgba(232,89,12,.15); } }
.shot .num { position: absolute; transform: translate(-50%, -115%); background: #e8590c; color: #fff; font: 700 13px/1 system-ui;
  padding: 5px 8px; border-radius: 12px; white-space: nowrap; pointer-events: none; }
.shot .num.below { transform: translate(-50%, 35%); }
.shot .num.badge { width: 22px; height: 22px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
  background: #e11d48; transform: translate(-120%, -50%); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.35); }
.shot .num.badge.inside { transform: translate(-115%, -50%); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px var(--ring); } 50% { box-shadow: 0 0 0 7px var(--ring); } }
.pointer { position: absolute; width: 26px; height: 26px; pointer-events: none; z-index: 3; transition: left .9s cubic-bezier(.3,.7,.3,1), top .9s cubic-bezier(.3,.7,.3,1); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.pointer.click { animation: tap .5s ease-out 1s 2; }
@keyframes tap { 50% { transform: scale(.8); } }
.slide { animation: in .35s ease-out; }
@keyframes in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.tip { margin: 12px 16px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--chip); border-radius: 6px; font-size: 13px; }
.tip.warn { border-color: var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 16px; }
.arrow { border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
.arrow.prev { background: var(--chip); color: var(--ink); }
.arrow.next { background: var(--brand); color: var(--brand-ink); }
.arrow:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--brand); width: 20px; border-radius: 4px; }
.progress { height: 3px; background: var(--accent); width: 0; }
.progress.run { animation: fill linear forwards; }
@keyframes fill { to { width: 100%; } }
.foot { color: var(--muted); font-size: 12px; margin-top: 12px; }
/* inside the Odoo Help pop-up: compact, everything on one screen */
.framed .wrap { padding: 10px 14px 6px; }
.framed .foot { display: none; }
.framed h1 { font-size: 18px; margin: 0; }
.framed .sub { margin: 0 0 8px; }
.framed .top { margin: 0 0 4px; }
.framed .tabs { margin-bottom: 8px; }
.framed .nav { padding: 10px 16px 12px; }
.framed .text { padding: 4px 16px 8px; }
.top { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; font-size: 14px; }
.top[hidden] { display: none; }
.top a { background: var(--chip); color: var(--ink); text-decoration: none; font-weight: 600; border-radius: 8px; padding: 7px 14px; }
.top a:hover { background: var(--line); }
.top h1 { margin: 0; }
.arrow.prev:disabled { visibility: hidden; }   /* first step: no "Previous" at all */
/* screenshot zoom: over the guide, never a new tab */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.86); display: none; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
.lb.on { display: flex; }
.lb img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #fff; }
.lb button { position: absolute; top: 12px; right: 14px; border: 0; border-radius: 999px; width: 38px; height: 38px; font-size: 20px; line-height: 1; cursor: pointer; background: #fff; color: #1f2430; }
@media (max-width: 520px) { .arrow { padding: 9px 12px; } .row { flex-wrap: wrap; } .input { max-width: 100%; } .play { margin-left: 0; } }
</style>

  card.querySelector('.prev').onclick = () => { if (step > 0) { step--; draw(); } };
  card.querySelector('.next').onclick = () => { step = step === steps.length - 1 ? 0 : step + 1; draw(); };
  const screen = document.getElementById('screen');
  typeIn(screen);
  const place = () => setTimeout(() => {
    const ptr = document.getElementById('ptr'), t = screen.querySelector('.target');
    if (!ptr) return;
    if (!t) { ptr.style.display = 'none'; return; }
    const a = screen.getBoundingClientRect(), b = t.getBoundingClientRect();
    ptr.style.left = (b.left - a.left + Math.min(b.width * 0.6, Math.max(8, b.width - 14))) + 'px';
    ptr.style.top = (b.top - a.top + b.height * 0.45) + 'px';
    ptr.classList.add('click');
  }, 700);
  const img = screen.querySelector('.shot img');
  const ready = () => { fit(); scrollTo(0, keepY); place(); };
  if (img && !img.complete) img.addEventListener('load', ready, { once: true }); else requestAnimationFrame(ready);
  if (playing) timer = setTimeout(() => {
    if (step < steps.length - 1) { step++; draw(); }
    else if (q.has('play') && !q.has('for') && order.indexOf(cur) < order.length - 1) { cur = order[order.indexOf(cur) + 1]; step = 0; draw(); }   // video: every part
    else { playing = false; draw(); document.title = 'DONE'; }
  }, ms);
}
document.addEventListener('keydown', e => {
  if (lb.classList.contains('on')) { if (e.key === 'Escape') { lb.classList.remove('on'); e.stopPropagation(); } return; }
  if (e.key === 'ArrowRight') card.querySelector('.next').click();
  if (e.key === 'ArrowLeft') card.querySelector('.prev').click();
});
draw();
</script>
</body>
</html>
