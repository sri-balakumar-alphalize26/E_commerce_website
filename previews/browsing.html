  .ls-main { padding-bottom: 60px; }
  .hm-page:has(.ls-mbar) .ft-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
  .hm-page.hm-has-cart:has(.ls-mbar) .ft-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 146px); }
  .cg-hero { padding: 20px; }
  .cg-hero h1 { font-size: 26px; }
  .of-hero { flex-direction: column; align-items: flex-start; }
  .pd-fbt-row { flex-direction: column; align-items: stretch; }
  .pd-fbt-total { width: auto; padding: 14px 0 0; border-left: 0; border-top: 1px solid var(--pd-line, #e3eaef); }
}
@media (max-width: 560px) {
  .ls-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ls-count h2 { font-size: 19px; }
  .cg-hero { min-height: 0; }
  .cg-hero-art { display: none; }
  .cg-hero h1 { font-size: 23px; }
  .cg-hero p { font-size: 13.5px; }
  .cg-sub { width: 80px; font-size: 12px; }
  .cg-sub-img { width: 72px; height: 72px; border-radius: 20px; }
  .sp-bar { height: 50px; padding-left: 14px; }
  .sp-bar .ls-primary { padding: 0 14px; height: 38px; }
  .of-hero { padding: 22px 18px; }
  .of-hero h1 { font-size: 23px; }
  .of-cell { width: 58px; }
  .of-cell b { font-size: 22px; }
  .ba-head h1 { font-size: 24px; }
  .ba-last { width: 100%; }
  .ba-last .ls-primary { margin-left: auto; padding: 0 14px; }
  .ft-top { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; padding-top: 30px; }
  .ft-bottom { flex-direction: column-reverse; align-items: flex-start; }
  .nf-4 { font-size: 84px; }
  .nf-basket { width: 88px; height: 88px; padding: 12px; }
  .pd-fbt { padding: 16px 14px; }
  .pd-fbt-items { flex-direction: column; overflow: visible; gap: 6px; }
  .pd-fbt-item { flex: none; max-width: none; display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; row-gap: 2px; align-items: center; }
  .pd-fbt-img { grid-row: 1 / 3; aspect-ratio: 1; padding: 6px; }
  .pd-fbt-price { padding-left: 26px; align-self: start; }
  .pd-fbt-plus { width: 22px; height: 22px; margin: -8px 0 -8px 21px; align-self: flex-start; position: relative; z-index: 1; }
  .pd-size { min-width: 0; flex: 1 1 calc(33% - 8px); }
}

/* ---------------- keyframes ---------------- */
@keyframes ls-side-in { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
@keyframes ls-card-in { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes ls-count { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes ls-sheet { from { transform: translateY(100%); } to { transform: none; } }
@keyframes ls-mbar { from { opacity: 0; transform: translate(-50%, 30px) scale(0.9); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes ls-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes sk-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes cg-hero { from { opacity: 0; transform: translateY(12px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes cg-art-in { from { opacity: 0; transform: translateY(24px) scale(0.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes of-tick { from { opacity: 0; transform: translateY(-60%); } to { opacity: 1; transform: none; } }
@keyframes nf-drop { 0% { opacity: 0; transform: translateY(-60px); } 60% { opacity: 1; transform: translateY(6px); } 100% { transform: none; } }
@keyframes nf-tilt { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(6deg); } 55% { transform: rotate(0); } }
@keyframes nf-fall { 0% { opacity: 0; transform: translateY(-30px); } 15% { opacity: 1; } 45% { opacity: 1; transform: translateY(40px) scale(0.8); } 55%, 100% { opacity: 0; transform: translateY(46px) scale(0.4); } }
@keyframes pd-roll { from { opacity: 0; transform: translateY(55%); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .ft-col, .ft-pay em { opacity: 1 !important; transform: none !important; }
  .sk { animation: none !important; }
}
