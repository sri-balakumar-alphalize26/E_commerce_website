<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>369 Mart Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,700..800&display=swap">
<style>
:root{color-scheme:light}
[hidden]{display:none!important}
body{margin:0;background:#f2f6f9;color:#0f2233;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{min-height:100vh}
.pv-hdr{padding:0 16px;background:#f2f6f9}
.pv-hdr svg,.pv-pills svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pv-hdr-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;border-radius:0 0 22px 22px;background:linear-gradient(90deg,#0a4568,#0b6a9b);color:#fff}
.pv-hdr button{font:inherit;color:inherit;cursor:pointer}
.pv-logo{display:flex;align-items:center;font-size:23px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:-.02em}
.pv-logo svg{width:20px;height:20px;color:#f7931e;stroke-width:2.8;margin:0 1px}
.pv-mode{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px}
.pv-mode button{display:flex;align-items:center;gap:4px;border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13.5px}
.pv-mode button.on{background:#fff;color:#0f2233}
.pv-mode svg{width:14px;height:14px;fill:currentColor}
.pv-loc{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.3);background:none;border-radius:999px;padding:4px 14px 4px 10px;text-align:left}
.pv-loc svg{width:18px;height:18px}.pv-loc b{display:block;font-size:13.5px;line-height:1.1}.pv-loc small{font-size:11px;opacity:.8}
.pv-search{flex:1;display:flex;align-items:center;gap:8px;height:40px;border-radius:999px;background:#fff;color:#6a7c8b;padding:0 16px;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden}
.pv-search svg{width:18px;height:18px;flex:none}
.pv-cart{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3);background:none;border-radius:999px;padding:7px 14px;font-weight:700}
.pv-cart svg,.pv-acc svg{width:18px;height:18px}
.pv-acc{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);background:none;border-radius:50%}
.pv-pills{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:1480px;margin:0 auto;scrollbar-width:none}
.pv-pills button{flex:none;font:inherit;font-weight:600;font-size:14px;border:1px solid #d6e1e9;background:#fff;border-radius:999px;padding:7px 15px;color:#0f2233;cursor:pointer}
.pv-note{max-width:1080px;margin:-24px auto 0;padding:0 16px 32px;color:#6a7c8b;font-size:12px;text-align:center}
@media (max-width:900px){.pv-mode,.pv-loc{display:none}.pv-hdr-in{padding:10px 14px;gap:10px}.pv-cart span{display:none}}
@media (max-width:560px){.pv-hdr-in{flex-wrap:wrap}.pv-search{order:3;flex-basis:100%}.pv-cart{margin-left:auto}}

/* ==========================================================================
   369 Mart — sign in page. Everything is scoped under .si-* ; colours follow
   the storefront header (navy → ocean blue, orange accent). Type: Inter.
   ========================================================================== */
.si-page {
  --si-navy: #0b4a6e;
  --si-blue: #0a78ab;
  --si-blue-d: #08658f;
  --si-orange: #f7931e;
  --si-ink: #0f2233;
  --si-muted: #5f7385;
  --si-line: #d6e1e9;
  --si-field: #fbfdfe;
  --si-ground: #f2f6f9;
  --si-err: #c43d34;
  --si-ok: #1d7a4c;
  --si-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --si-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  max-width: 1080px;
  margin: 0 auto;
  padding: 18px 16px 48px;
  color: var(--si-ink);
  font-family: var(--font-inter, "Inter"), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;

}
.si-page *, .si-page *::before, .si-page *::after { box-sizing: border-box; }
.si-page svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.si-crumb {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--si-muted); font-weight: 600; font-size: 13.5px; text-decoration: none;
  margin-bottom: 14px;
}
.si-crumb svg { width: 16px; height: 16px; transition: transform 200ms var(--si-ease); }
.si-crumb:hover { color: var(--si-blue); }
.si-crumb:hover svg { transform: translateX(-3px); }

.si-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
  gap: 24px;
  align-items: stretch;
}

/* ---------------- aside ---------------- */
.si-aside {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border-radius: 22px;
  padding: 36px 36px 28px;
  color: #fff;
  background: linear-gradient(150deg, #083b59 0%, #0b5a86 55%, #0a78ab 100%);
  display: flex; flex-direction: column; gap: 28px;
  animation: si-rise 700ms var(--si-ease) both;
}
.si-aside::before {
  content: ""; position: absolute; z-index: -1; width: 420px; aspect-ratio: 1; right: -140px; bottom: -160px;
  border-radius: 50%; background: radial-gradient(circle, rgba(247, 147, 30, 0.28), transparent 62%);
  animation: si-drift 14s ease-in-out infinite alternate;
}
.si-aside::after {
  content: ""; position: absolute; z-index: -1; inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
  background-size: 18px 18px;
  -webkit-mask-image: linear-gradient(160deg, #000 10%, transparent 60%); mask-image: linear-gradient(160deg, #000 10%, transparent 60%);
}
.si-eyebrow { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #ffc27a; }
.si-aside h2 { margin: 0; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.16; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance; max-width: 20ch; }
.si-perks { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 12px; }
.si-perks li {
  display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: rgba(255, 255, 255, 0.92);
  animation: si-rise 560ms var(--si-ease) both; animation-delay: calc(260ms + var(--k, 0) * 80ms);
}
.si-perks li:nth-child(2) { --k: 1; } .si-perks li:nth-child(3) { --k: 2; } .si-perks li:nth-child(4) { --k: 3; }
.si-perks li > span {
  flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.18);
}
.si-perks svg { width: 18px; height: 18px; }

.si-tiles { position: relative; height: 150px; margin-top: auto; }
.si-tile {
  position: absolute; width: 190px; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px 8px 8px; border-radius: 14px; background: #fff; color: var(--si-ink);
  box-shadow: 0 18px 34px -18px rgba(3, 20, 32, 0.6);
  left: calc(var(--n) * 30%); top: calc(var(--n) * 26px + (var(--n) - 1) * (var(--n) - 1) * 10px);
  animation: si-tile-in 700ms var(--si-spring) both, si-bob 5.5s ease-in-out infinite;
  animation-delay: calc(500ms + var(--n) * 120ms), calc(1200ms + var(--n) * 700ms);
}
.si-tile-img {
  flex: none; width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); font-weight: 800; font-size: 14px;
  border-top: 10px solid var(--c);
}
.si-tile-txt { display: flex; flex-direction: column; min-width: 0; font-size: 12px; line-height: 1.3; }
.si-tile-txt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--si-muted); }
.si-tile-txt strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.si-trust { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(255, 255, 255, 0.72); }
.si-trust svg { width: 16px; height: 16px; flex: none; }

/* ---------------- card ---------------- */
.si-card {
  background: #fff; border: 1px solid var(--si-line); border-radius: 22px;
  padding: 30px 30px 22px;
  box-shadow: 0 1px 0 rgba(15, 34, 51, 0.03), 0 24px 48px -32px rgba(11, 74, 110, 0.35);
  animation: si-rise 640ms var(--si-ease) 80ms both;
  display: flex; flex-direction: column; align-self: start;
}
.si-stage { transition: height 320ms var(--si-ease); overflow: hidden; margin: -6px; padding: 6px; }
.si-swap { display: flex; flex-direction: column; }
.si-step { display: flex; flex-direction: column; gap: 18px; padding: 2px; }
.si-fwd  > *, .si-back > * { animation: si-step-in 420ms var(--si-ease) both; }
.si-fwd  > * { --sx: 26px; } .si-back > * { --sx: -26px; }
.si-step > :nth-child(2) { animation-delay: 40ms; } .si-step > :nth-child(3) { animation-delay: 80ms; }
.si-step > :nth-child(4) { animation-delay: 120ms; } .si-step > :nth-child(n+5) { animation-delay: 160ms; }

.si-head h1 { margin: 0; font-size: 25px; line-height: 1.2; font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
.si-head p { margin: 6px 0 0; color: var(--si-muted); font-size: 14px; }
.si-head b { color: var(--si-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

.si-badge {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 14px;
  background: #e5f2f8; color: var(--si-blue); animation: si-pop 520ms var(--si-spring) 120ms both;
}
.si-badge svg { width: 24px; height: 24px; }
.si-badge-ok { background: #e3f3ea; color: var(--si-ok); }

/* segmented control */
.si-seg {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px;
  background: #eef3f7; border-radius: 12px;
}
.si-seg-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 9px; background: #fff;
  box-shadow: 0 1px 2px rgba(15, 34, 51, 0.12), 0 4px 10px -6px rgba(15, 34, 51, 0.3);
  transform: translateX(calc(var(--i) * 100%)); transition: transform 320ms var(--si-spring);
}
.si-seg button {
  position: relative; border: 0; background: none; height: 38px; border-radius: 9px; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--si-muted); transition: color 200ms;
}
.si-seg button[aria-selected="true"] { color: var(--si-ink); }

/* fields */
.si-form { display: flex; flex-direction: column; gap: 16px; }
.si-field { display: flex; flex-direction: column; gap: 7px; }
.si-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.si-field label { font-size: 14px; font-weight: 600; }
.si-opt { font-weight: 500; color: var(--si-muted); font-size: 12.5px; margin-left: 4px; }
.si-input {
  width: 100%; height: 50px; border: 1.5px solid var(--si-line); border-radius: 12px; background: var(--si-field);
  font: inherit; font-size: 15.5px; color: var(--si-ink); padding: 0 14px; outline: none;
  transition: border-color 180ms, box-shadow 220ms var(--si-ease), background-color 180ms;
}
input.si-input::placeholder, .si-input input::placeholder { color: #9aabb8; }
.si-input:hover { border-color: #b9cad6; }
.si-input:focus, .si-input:focus-within {
  border-color: var(--si-blue); background: #fff; box-shadow: 0 0 0 4px rgba(10, 120, 171, 0.14);
}
.si-invalid .si-input, .si-invalid .si-input:focus-within, .si-invalid .si-input:focus {
  border-color: var(--si-err); box-shadow: 0 0 0 4px rgba(196, 61, 52, 0.12);
}
.si-phone, .si-pw { display: flex; align-items: center; padding: 0; overflow: hidden; }
.si-phone select {
  height: 100%; border: 0; background: transparent; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--si-ink);
  padding: 0 8px 0 14px; border-right: 1.5px solid var(--si-line); outline: none; cursor: pointer;
}
.si-phone input, .si-pw input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
  font: inherit; font-size: 15.5px; color: var(--si-ink); padding: 0 14px; letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.si-ok-tick {
  flex: none; width: 22px; height: 22px; margin-right: 12px; border-radius: 50%; display: grid; place-items: center;
  background: var(--si-ok); color: #fff; animation: si-pop 420ms var(--si-spring) both;
}
.si-ok-tick svg { width: 14px; height: 14px; stroke-width: 3; stroke-dasharray: 40; animation: si-draw 360ms var(--si-ease) 120ms both; }
.si-eye { flex: none; width: 46px; height: 100%; border: 0; background: none; color: var(--si-muted); cursor: pointer; display: grid; place-items: center; }
.si-eye svg { width: 20px; height: 20px; }
.si-eye-slash { stroke-dasharray: 23; stroke-dashoffset: 23; transition: stroke-dashoffset 260ms var(--si-ease); }
.si-eye[aria-pressed="true"] .si-eye-slash { stroke-dashoffset: 0; }
.si-eye:hover { color: var(--si-ink); }

.si-err { margin: 0; font-size: 13px; color: var(--si-err); font-weight: 600; animation: si-rise 260ms var(--si-ease) both; }
.si-hint { margin: 0; font-size: 12.5px; color: var(--si-muted); }
.si-center { text-align: center; }

.si-check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; user-select: none; }
.si-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.si-box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #b3c4d0; display: grid; place-items: center;
  transition: background-color 180ms, border-color 180ms; color: #fff;
}
.si-box svg { width: 13px; height: 13px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 240ms var(--si-ease); }
.si-check input:checked + .si-box { background: var(--si-blue); border-color: var(--si-blue); }
.si-check input:checked + .si-box svg { stroke-dashoffset: 0; }
.si-check input:focus-visible + .si-box { box-shadow: 0 0 0 3px rgba(247, 147, 30, 0.5); }

/* buttons */
.si-btn {
  position: relative; overflow: hidden; height: 52px; border: 0; border-radius: 14px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: inherit; font-size: 16px; font-weight: 700; color: #fff;
  background: linear-gradient(180deg, #0c86be, var(--si-blue-d));
  box-shadow: 0 10px 20px -12px rgba(8, 101, 143, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transition: transform 160ms var(--si-ease), box-shadow 200ms, filter 200ms, opacity 200ms;
}
.si-btn::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-120%);
  background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, 0.28) 50%, transparent 65%);
}
.si-btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform 700ms var(--si-ease); }
.si-btn:hover:not(:disabled) { filter: brightness(1.06); }
.si-btn:active:not(:disabled) { transform: scale(0.985); }
.si-btn:disabled { cursor: not-allowed; background: #c9d7e0; box-shadow: none; color: #f6f9fb; }
.si-btn:disabled:has(.si-spin) { background: linear-gradient(180deg, #0c86be, var(--si-blue-d)); color: #fff; }
.si-spin {
  width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.35); border-top-color: #fff;
  animation: si-spin 700ms linear infinite;
}

.si-link { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--si-blue); cursor: pointer; font-size: inherit; }
.si-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.si-right { font-size: 13px; }

.si-or { display: flex; align-items: center; gap: 12px; color: var(--si-muted); font-size: 12.5px; }
.si-or::before, .si-or::after { content: ""; flex: 1; height: 1px; background: var(--si-line); }
.si-social { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.si-ghost {
  height: 46px; border-radius: 12px; border: 1.5px solid var(--si-line); background: #fff; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--si-ink);
  transition: border-color 180ms, transform 160ms var(--si-ease), box-shadow 200ms;
}
.si-ghost svg { width: 18px; height: 18px; }
.si-ghost:hover { border-color: #aebfcb; box-shadow: 0 6px 14px -10px rgba(15, 34, 51, 0.4); transform: translateY(-1px); }
.si-guest {
  align-self: center; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 700; color: var(--si-ink);
}
.si-guest svg { width: 16px; height: 16px; transition: transform 200ms var(--si-ease); }
.si-guest:hover svg { transform: translateX(3px); }

.si-back-btn {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; margin: -4px 0 -6px -6px; padding: 4px 6px;
  border: 0; background: none; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--si-muted);
}
.si-back-btn svg { width: 16px; height: 16px; }
.si-back-btn:hover { color: var(--si-ink); background: #f0f4f7; }

/* OTP */
.si-otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.si-otp input {
  width: 100%; aspect-ratio: 1 / 1.12; max-height: 62px; text-align: center; border: 1.5px solid var(--si-line); border-radius: 12px;
  background: var(--si-field); font: inherit; font-size: 22px; font-weight: 800; color: var(--si-ink); outline: none; caret-color: var(--si-blue);
  transition: border-color 160ms, box-shadow 200ms var(--si-ease), transform 200ms var(--si-spring), background-color 160ms;
  animation: si-pop 440ms var(--si-spring) both; animation-delay: calc(140ms + var(--i) * 45ms);
  font-variant-numeric: tabular-nums;
}
.si-otp input:focus { border-color: var(--si-blue); background: #fff; box-shadow: 0 0 0 4px rgba(10, 120, 171, 0.14); transform: translateY(-2px); }
.si-otp input.si-filled { border-color: #8fb9cf; background: #fff; }
.si-otp.si-shake input { border-color: var(--si-err); }
.si-resend { margin: -4px 0 0; text-align: center; font-size: 13.5px; color: var(--si-muted); }
.si-resend b { color: var(--si-ink); font-variant-numeric: tabular-nums; }

/* done */
.si-done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 0 6px; }
.si-done h1 { margin: 12px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.si-done p { margin: 0 0 14px; color: var(--si-muted); max-width: 30ch; }
.si-done .si-btn { align-self: stretch; }
.si-done-mark { width: 84px; height: 84px; color: var(--si-ok); }
.si-done-mark circle { stroke-width: 3; stroke-dasharray: 176; animation: si-draw-c 620ms var(--si-ease) both; fill: #e3f3ea; }
.si-done-mark path { stroke-width: 4.5; stroke-dasharray: 40; animation: si-draw 420ms var(--si-ease) 480ms both; }

.si-legal { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid #eaf0f4; font-size: 12px; color: var(--si-muted); text-align: center; }
.si-legal a { color: var(--si-ink); font-weight: 600; }

.si-shake { animation: si-shake 420ms var(--si-ease) !important; }
.si-page :focus-visible { outline: 2px solid var(--si-orange); outline-offset: 2px; }
.si-input:focus-visible, .si-otp input:focus-visible, .si-phone input:focus-visible, .si-pw input:focus-visible, .si-phone select:focus-visible { outline: none; }

/* password strength */
.si-meter { display: grid; grid-template-columns: repeat(4, 1fr) auto; align-items: center; gap: 5px; margin-top: 2px; }
.si-meter span { height: 4px; border-radius: 4px; background: #e3eaf0; transition: background-color 260ms var(--si-ease), transform 260ms var(--si-spring); }
.si-meter em { font-style: normal; font-size: 12px; font-weight: 700; min-width: 44px; text-align: right; color: var(--si-muted); }
.si-meter[data-score="1"] span:nth-child(-n+1) { background: var(--si-err); }
.si-meter[data-score="2"] span:nth-child(-n+2) { background: #e08a1e; }
.si-meter[data-score="3"] span:nth-child(-n+3) { background: #2b8ec2; }
.si-meter[data-score="4"] span:nth-child(-n+4) { background: var(--si-ok); }
.si-meter[data-score="0"] em { visibility: hidden; }
.si-check a { color: var(--si-ink); font-weight: 600; }
.si-check-err .si-box { border-color: var(--si-err); animation: si-shake 420ms var(--si-ease); }
.si-mail { width: 60px; height: 60px; border-radius: 18px; margin: 4px 0 6px; }
.si-mail svg { width: 30px; height: 30px; }
.si-done .si-resend { margin-top: 6px; }

/* ---------------- responsive ---------------- */
@media (max-width: 900px) {
  .si-grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; }
  .si-aside { padding: 22px 22px 20px; gap: 0; border-radius: 18px; }
  .si-aside h2 { font-size: 20px; max-width: none; }
  .si-perks { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .si-perks li { font-size: 12.5px; gap: 8px; align-items: flex-start; }
  .si-perks li > span { width: 28px; height: 28px; border-radius: 8px; }
  .si-perks svg { width: 15px; height: 15px; }
  .si-tiles, .si-trust { display: none; }
  .si-grid > .si-card { order: -1; }
}
@media (max-width: 480px) {
  .si-card { padding: 22px 18px 16px; border-radius: 18px; }
  .si-head h1 { font-size: 21px; }
  .si-social { grid-template-columns: 1fr; }
  .si-otp { gap: 7px; }
  .si-perks { grid-template-columns: 1fr; }
}

/* ---------------- keyframes ---------------- */
@keyframes si-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes si-step-in { from { opacity: 0; transform: translateX(var(--sx, 26px)); } to { opacity: 1; transform: none; } }
@keyframes si-pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes si-tile-in { from { opacity: 0; transform: translateY(30px) rotate(-4deg) scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes si-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
@keyframes si-drift { from { transform: translate(0, 0); } to { transform: translate(-60px, -50px) scale(1.15); } }
@keyframes si-spin { to { transform: rotate(360deg); } }
@keyframes si-draw { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
@keyframes si-draw-c { from { stroke-dashoffset: 176; } to { stroke-dashoffset: 0; } }
@keyframes si-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

@media (prefers-reduced-motion: reduce) {
  .si-page *, .si-page *::before, .si-page *::after { animation: none !important; transition: none !important; }
}
