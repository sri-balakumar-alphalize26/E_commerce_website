<title>369 Mart Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,700..800&display=swap">
<style>:root{color-scheme:light}*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#fff;color:#13212b;font-family:Inter,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* ==========================================================================
   369 Mart — Home. Scoped under .hm-* . Type: Inter (same family Flipkart's web store uses).
   ========================================================================== */
.hm-page {
  --hm-ink: #13212b;
  --hm-muted: #6b7a86;
  --hm-line: #e7ecf0;
  --hm-soft: #f4f6f8;
  --hm-ground: #ffffff;
  --hm-navy: #0b4a6e;
  --hm-blue: #0a78ab;
  --hm-blue-d: #08658f;
  --hm-orange: #f7931e;
  --hm-orange-soft: #fff1de;
  --hm-green: #1f8a3c;
  --hm-red: #c8433a;
  --hm-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --hm-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --hm-card-w: 172px;
  /* mode accent — Quick = orange, Express = ocean blue */
  --hm-accent: #f7931e;
  --hm-accent-2: #ef6f1a;
  --hm-accent-soft: #fff1de;
  --hm-accent-line: #ffd9a8;
  --hm-accent-ink: #8a4a00;

  background: var(--hm-ground);
  color: var(--hm-ink);
  font-family: var(--font-inter, "Inter"), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
  padding-bottom: 24px;
  transition: padding-bottom 300ms var(--hm-ease);
}
.hm-page.hm-has-cart { padding-bottom: 96px; }
.hm-page[data-mode="all"] {
  --hm-accent: #0a78ab;
  --hm-accent-2: #0b4a6e;
  --hm-accent-soft: #e6f2f9;
  --hm-accent-line: #bcdcee;
  --hm-accent-ink: #0b4a6e;
}
.hm-page *, .hm-page *::before, .hm-page *::after { box-sizing: border-box; }
.hm-page button { font: inherit; color: inherit; cursor: pointer; }
.hm-page a { color: inherit; }
.hm-ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hm-ic.hm-fill { fill: currentColor; stroke: none; }
.hm-art { width: 100%; height: 100%; display: block; }
.hm-page :focus-visible { outline: 2px solid var(--hm-orange); outline-offset: 2px; }
.hm-wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; }

/* ---------------- header ---------------- */
.hm-hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #fff;
  transition: box-shadow 240ms var(--hm-ease);
}
.hm-hdr.hm-scrolled { box-shadow: 0 6px 18px -12px rgba(19, 33, 43, 0.35); }
.hm-hdr-row { display: flex; align-items: center; gap: 16px; height: 64px; }
.hm-logo { display: flex; align-items: center; text-decoration: none; font-size: 24px; font-weight: 800; letter-spacing: -0.045em; color: var(--hm-navy) !important; }
.hm-logo-arrow { width: 19px; height: 19px; fill: none; stroke: var(--hm-orange); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; margin: 0 1px; animation: hm-arrow 3.6s var(--hm-ease) 1s infinite; }
.hm-mode { position: relative; display: flex; background: var(--hm-soft); border-radius: 999px; padding: 3px; }
.hm-mode-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px;
  background: linear-gradient(135deg, var(--hm-accent), var(--hm-accent-2));
  box-shadow: 0 5px 12px -6px var(--hm-accent);
  transition: transform 520ms var(--hm-spring), width 520ms var(--hm-spring), background 400ms, box-shadow 400ms;
}
.hm-mode button { position: relative; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; transition: color 300ms; }
.hm-mode button i { font-style: italic; font-weight: 800; }
.hm-mode button .hm-ic { transition: transform 420ms var(--hm-spring); }
.hm-mode button[aria-selected="true"] { color: #fff !important; }
.hm-mode button[aria-selected="true"] .hm-ic { animation: hm-mode-ic 560ms var(--hm-spring); }
.hm-mode button[aria-selected="false"] { color: var(--hm-ink); }
.hm-mode button[aria-selected="false"]:hover .hm-ic { transform: rotate(-12deg) scale(1.15); }
.hm-loc-ic { display: grid; place-items: center; color: var(--hm-ink); animation: hm-pop 460ms var(--hm-spring) both; }
.hm-loc { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; min-width: 0; max-width: 230px; padding: 4px 6px; border-radius: 10px; }
.hm-loc:hover { background: var(--hm-soft); }

.hm-loc-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.hm-loc-txt b { display: inline-flex; align-items: center; gap: 2px; font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
.hm-loc-txt small { font-size: 12px; color: var(--hm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-search {
  flex: 1; max-width: 520px; margin-left: auto; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border: 1px solid transparent; border-radius: 999px; background: var(--hm-soft); color: var(--hm-muted); text-align: left; font-size: 15px; font-weight: 400;
  transition: border-color 200ms, background-color 200ms, box-shadow 240ms var(--hm-ease);
}
.hm-search:hover { background: #fff; border-color: var(--hm-line); box-shadow: 0 4px 14px -10px rgba(19, 33, 43, 0.4); }
.hm-search-ph { display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.hm-roll { display: inline-grid; height: 1.4em; overflow: hidden; }
.hm-roll > span { grid-area: 1 / 1; line-height: 1.4em; transition: transform 460ms var(--hm-ease), opacity 360ms; opacity: 0; transform: translateY(90%); }
.hm-roll > span[data-s="in"] { opacity: 1; transform: none; }
.hm-roll > span[data-s="out"] { transform: translateY(-90%); }
.hm-icons { display: flex; align-items: center; gap: 4px; }
.hm-iconbtn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; color: var(--hm-ink); transition: background-color 180ms; }
.hm-iconbtn:hover { background: var(--hm-soft); }
.hm-badge {
  position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center;
  background: var(--hm-red); color: #fff; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; border: 2px solid #fff;
  animation: hm-pop 420ms var(--hm-spring) both;
}
.hm-avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 0; margin-left: 4px; background: linear-gradient(145deg, #d7ecf7, #a9d2e8); color: var(--hm-navy); }

/* tabs */
.hm-tabs-bar { background: #fff; border-bottom: 1px solid var(--hm-line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 49; }
.hm-tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
.hm-tabs::-webkit-scrollbar { display: none; }
.hm-tab-ind { position: absolute; left: 0; top: 8px; bottom: 8px; border-radius: 999px; background: var(--hm-accent-soft); box-shadow: inset 0 0 0 1px var(--hm-accent-line); transition: transform 380ms var(--hm-spring), width 380ms var(--hm-spring); }
.hm-tabs button {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 999px;
  padding: 7px 14px; font-size: 15px; font-weight: 500; letter-spacing: -0.005em; color: #3a4750; transition: color 200ms;
  animation: hm-drop 480ms var(--hm-ease) both; animation-delay: calc(var(--i) * 40ms);
}
.hm-tabs button:hover { color: var(--hm-ink); }
.hm-tabs button[aria-selected="true"] { color: var(--hm-accent-ink); font-weight: 600; }

/* ---------------- main ---------------- */
.hm-main { display: flex; flex-direction: column; gap: 30px; padding-top: 18px; }

/* banners */
.hm-banners { position: relative; }
.hm-banner-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 16px) / 2); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hm-banner-track::-webkit-scrollbar { display: none; }
.hm-banner {
  position: relative; overflow: hidden; isolation: isolate; scroll-snap-align: start; display: flex; align-items: stretch; min-height: 176px;
  border-radius: 16px; text-decoration: none; color: #fff; padding: 22px 24px;
  animation: hm-rise 620ms var(--hm-ease) backwards; animation-delay: calc(120ms + var(--i) * 90ms);
  transition: transform 300ms var(--hm-ease), box-shadow 300ms;
}
.hm-page .hm-banner { color: #fff; }
.hm-banner:hover { transform: translateY(-3px); box-shadow: 0 18px 30px -22px rgba(19, 33, 43, 0.6); }
.hm-banner::before { content: ""; position: absolute; z-index: -1; width: 260px; aspect-ratio: 1; right: -40px; top: -60px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.hm-tone-green  { background: linear-gradient(120deg, #13613c, #2d9a5a); }
.hm-tone-navy   { background: linear-gradient(120deg, #083b59, #0a78ab); }
.hm-tone-brown  { background: linear-gradient(120deg, #7a4326, #b8774a); }
.hm-tone-orange { background: linear-gradient(120deg, #d86a0c, #f7a23a); }
.hm-tone-teal   { background: linear-gradient(120deg, #0e5a63, #1c8c8f); }
.hm-tone-indigo { background: linear-gradient(120deg, #26306b, #4a5bb0); }
.hm-banner-copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; max-width: 58%; }
.hm-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.hm-banner strong { font-size: clamp(20px, 2.1vw, 27px); line-height: 1.12; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; margin-top: 4px; }
.hm-note { font-size: 14.5px; font-weight: 600; opacity: 0.92; margin-top: 2px; }
.hm-shop { margin-top: auto; display: inline-flex; align-items: center; gap: 2px; background: #fff; color: var(--hm-ink); font-size: 13px; font-weight: 800; border-radius: 999px; padding: 7px 12px 7px 14px; transition: gap 200ms; }
.hm-banner:hover .hm-shop { gap: 6px; }
.hm-banner-art { position: absolute; right: 8px; bottom: 6px; width: 46%; height: 82%; }
.hm-banner-art > span { position: absolute; width: 58%; aspect-ratio: 1.2; bottom: calc(var(--k) * 10%); right: calc(var(--k) * 30%); filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.18)); animation: hm-float 5s ease-in-out infinite; animation-delay: calc(var(--k) * -1.6s); }
.hm-banner-art > span:first-child { width: 66%; z-index: 2; }

.hm-inline-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.hm-inline-banners .hm-banner { min-height: 150px; }

/* arrows */
.hm-arrow {
  position: absolute; top: 50%; z-index: 5; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: #fff; color: var(--hm-ink); box-shadow: 0 4px 14px -4px rgba(19, 33, 43, 0.35); animation: hm-pop 260ms var(--hm-spring) both;
  transition: transform 180ms var(--hm-ease);
}
.hm-arrow:hover { transform: scale(1.08); }
.hm-arrow-l { left: -14px; }
.hm-arrow-r { right: -14px; }

/* category strip */
.hm-cats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }
.hm-cat { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 500; color: #212121; text-align: center; line-height: 1.25; opacity: 0; transform: translateY(12px); transition: opacity 500ms var(--hm-ease), transform 500ms var(--hm-ease); transition-delay: calc(var(--i) * 45ms); }
.hm-cats.hm-in .hm-cat { opacity: 1; transform: none; }
.hm-cat-img { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 20px; padding: 14%; display: grid; place-items: center; transition: transform 300ms var(--hm-spring), box-shadow 300ms; }
.hm-cat:hover .hm-cat-img { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 20px -16px rgba(19, 33, 43, 0.6); }

/* rails */
.hm-rail-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.hm-rail-head h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.hm-rail-head p { margin: 3px 0 0; font-size: 14px; color: var(--hm-muted); }
.hm-viewall { display: inline-flex; align-items: center; gap: 1px; font-size: 14px; font-weight: 700; color: var(--hm-blue) !important; text-decoration: none; white-space: nowrap; }
.hm-viewall .hm-ic { transition: transform 200ms var(--hm-ease); }
.hm-viewall:hover .hm-ic { transform: translateX(3px); }
.hm-rail-box { position: relative; }
.hm-rail-box .hm-arrow { top: calc(var(--hm-card-w) * 0.5); }
.hm-rail-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 10px; scrollbar-width: none; }
.hm-rail-track::-webkit-scrollbar { display: none; }

/* card */
.hm-card {
  flex: 0 0 var(--hm-card-w); scroll-snap-align: start; display: flex; flex-direction: column; background: #fff;
  border-radius: 14px; border: 1px solid var(--hm-line);
  opacity: 0; transform: translateX(18px);
  transition: opacity 520ms var(--hm-ease), transform 520ms var(--hm-ease), box-shadow 260ms, border-color 260ms;
  transition-delay: calc(min(var(--i), 8) * 50ms);
}
.hm-rail.hm-in .hm-card { opacity: 1; transform: none; }
.hm-rail.hm-in .hm-card:hover { transition-delay: 0s; box-shadow: 0 14px 28px -20px rgba(19, 33, 43, 0.5); border-color: #d6dfe6; }
.hm-card-img { position: relative; aspect-ratio: 1; border-radius: 13px 13px 0 0; overflow: hidden; background: linear-gradient(180deg, #f7f9fa 55%, #e9eef1); padding: 12% 10% 8%; }
.hm-card-img img, .hm-card-img .hm-art { width: 100%; height: 100%; object-fit: contain; transition: transform 460ms var(--hm-ease); }
.hm-card:hover .hm-card-img img, .hm-card:hover .hm-card-img .hm-art { transform: scale(1.06); }
.hm-heart { position: absolute; top: 6px; left: 6px; width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; color: #b7c2ca; }
.hm-heart .hm-ic { fill: rgba(255, 255, 255, 0.85); transition: fill 200ms, stroke 200ms; }
.hm-heart:hover { color: var(--hm-muted); }
.hm-heart.hm-liked { color: #e23d4b; }
.hm-heart.hm-liked .hm-ic { fill: #e23d4b; animation: hm-heart 460ms var(--hm-spring); }
.hm-card-cta { position: absolute; top: 8px; right: 8px; z-index: 2; }
.hm-add {
  height: 30px; min-width: 58px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--hm-blue); background: #fff;
  color: var(--hm-blue) !important; font-weight: 700; font-size: 13.5px; box-shadow: 0 2px 6px -3px rgba(10, 120, 171, 0.5);
  transition: background-color 180ms, color 180ms, transform 160ms var(--hm-ease);
  animation: hm-fade 300ms var(--hm-ease) both;
}
.hm-add:hover { background: #eaf5fb; }
.hm-add:active { transform: scale(0.92); }
.hm-stepper {
  height: 30px; display: flex; align-items: center; border-radius: 8px; background: var(--hm-blue); color: #fff; overflow: hidden;
  box-shadow: 0 4px 10px -5px rgba(8, 101, 143, 0.8); transform-origin: right center; animation: hm-expand 320ms var(--hm-spring) both;
}
.hm-stepper button { width: 26px; height: 100%; border: 0; background: none; color: #fff !important; font-size: 17px; font-weight: 700; line-height: 1; }
.hm-stepper button:hover { background: rgba(255, 255, 255, 0.14); }
.hm-stepper-n { min-width: 20px; text-align: center; font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; animation: hm-bump 300ms var(--hm-spring); }
.hm-notify { height: 30px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 8px; border: 1.5px solid #c9d4dc; background: #fff; color: #51616d !important; font-size: 12.5px; font-weight: 700; }
.hm-notify.hm-done { border-color: var(--hm-green); color: var(--hm-green) !important; animation: hm-bump 320ms var(--hm-spring); }
.hm-off { position: absolute; left: 8px; bottom: 8px; background: var(--hm-green); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 3px 6px; letter-spacing: 0.02em; }
.hm-off.hm-new { background: var(--hm-navy); }
.hm-rail.hm-in .hm-off { animation: hm-pop 460ms var(--hm-spring) both; animation-delay: calc(min(var(--i), 8) * 50ms + 360ms); }
.hm-veg { position: absolute; right: 8px; bottom: 8px; width: 16px; height: 16px; border: 1.5px solid var(--hm-green); border-radius: 3px; background: #fff; display: grid; place-items: center; }
.hm-veg i { width: 7px; height: 7px; border-radius: 50%; background: var(--hm-green); }
.hm-oos .hm-card-img .hm-art, .hm-oos .hm-card-img img { filter: grayscale(0.85); opacity: 0.55; }
.hm-oos-tag { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); white-space: nowrap; background: rgba(19, 33, 43, 0.78); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
.hm-card-body { display: flex; flex-direction: column; gap: 3px; padding: 0 10px 10px; flex: 1; }
.hm-unit { text-align: center; font-size: 12.5px; color: var(--hm-muted); padding: 6px 0; margin: 0 -10px 4px; border-bottom: 1px solid var(--hm-line); }
.hm-name { margin: 0; font-size: 14px; font-weight: 400; color: #212121; letter-spacing: -0.005em; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.hm-subnote { font-size: 12px; color: var(--hm-muted); margin-top: -2px; }
.hm-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; margin-top: auto; padding-top: 4px; font-variant-numeric: tabular-nums; }
.hm-price b { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
.hm-price s { font-size: 12px; color: var(--hm-muted); }
.hm-price small { font-size: 11px; color: var(--hm-muted); }
.hm-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 16px; }
.hm-quick { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #7b8993; }
.hm-quick .hm-ic { color: var(--hm-orange); }
.hm-ship { color: #3d6f8c; }
.hm-ship .hm-ic { color: var(--hm-blue); }
.hm-low { font-size: 11px; font-weight: 700; color: #c9620c; }

/* free delivery pill */
.hm-free {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 60; display: flex; align-items: center; gap: 10px;
  max-width: calc(100vw - 32px); padding: 7px 16px 7px 7px; border-radius: 999px;
  background: rgba(233, 245, 252, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid #cfe6f3;
  box-shadow: 0 10px 24px -16px rgba(8, 101, 143, 0.7); font-size: 13px; color: var(--hm-ink);
  transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
  transition: transform 460ms var(--hm-spring), opacity 300ms, background-color 300ms, border-color 300ms;
}
.hm-free.hm-show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.hm-free-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--hm-blue); }
.hm-free.hm-show .hm-free-ic .hm-ic { animation: hm-ride 1.6s ease-in-out infinite; }
.hm-free-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hm-free-txt > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-free-txt b { font-weight: 800; }
.hm-free-bar { display: block; height: 4px; border-radius: 4px; background: rgba(10, 120, 171, 0.15); overflow: hidden; }
.hm-free-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--hm-blue), #3fb0e0); transition: width 520ms var(--hm-ease); }
.hm-free-done { background: rgba(230, 246, 236, 0.95); border-color: #bfe3cb; }
.hm-free-done .hm-free-ic { color: var(--hm-green); animation: hm-pop 420ms var(--hm-spring); }
.hm-free-done .hm-free-ic .hm-ic { animation: none !important; }
.hm-free-done .hm-free-bar i { background: var(--hm-green); }

/* cart bar */
.hm-cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #fff; border-top: 1px solid var(--hm-line);
  box-shadow: 0 -10px 24px -20px rgba(19, 33, 43, 0.5); padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(110%); transition: transform 440ms var(--hm-spring);
}
.hm-cartbar.hm-show { transform: none; }
.hm-cartbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 66px; }
.hm-cartbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hm-thumbs { display: flex; padding-left: 10px; }

/* ---------------- Quick <-> Express switch ---------------- */
.hm-switch {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; color: #fff; pointer-events: all;
  background: radial-gradient(120% 90% at var(--x) var(--y), #ffb14a 0%, #f7931e 38%, #e8631a 100%);
}
.hm-switch[data-to="all"] { background: radial-gradient(120% 90% at var(--x) var(--y), #1b9ad2 0%, #0a78ab 40%, #083b59 100%); }
.hm-switch::before {
  content: ""; position: absolute; inset: 0; opacity: 0.16;
  background-image: radial-gradient(#fff 1.2px, transparent 1.3px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent); mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent);
}
.hm-switch-in   { animation: hm-sw-in 520ms cubic-bezier(0.7, 0, 0.25, 1) both; }
.hm-switch-hold { clip-path: none; }
.hm-switch-out  { animation: hm-sw-out 560ms cubic-bezier(0.65, 0, 0.35, 1) both; }
.hm-switch-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 24px; }
.hm-switch-ic {
  width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; margin-bottom: 8px;
  background: rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 18px 30px -18px rgba(0, 0, 0, 0.5);
  animation: hm-sw-icon 620ms var(--hm-spring) 180ms both;
}

.hm-switch-bar { display: block; width: 120px; height: 4px; margin-top: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); overflow: hidden; position: relative; }
.hm-switch-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #fff; animation: hm-sw-load 900ms ease-in-out infinite; }
.hm-switch-out .hm-switch-card { animation: hm-sw-card-out 300ms var(--hm-ease) both; }

/* new page settles in under the lifting curtain */
.hm-page[data-mode] .hm-main { animation: hm-page-in 620ms var(--hm-ease) both; }

@keyframes hm-sw-in { from { clip-path: circle(0px at var(--x) var(--y)); } to { clip-path: circle(150vmax at var(--x) var(--y)); } }
@keyframes hm-sw-out {
  from { transform: translateY(0); border-radius: 0; }
  to { transform: translateY(-104%); border-radius: 0 0 50% 50% / 0 0 14vh 14vh; }
}
@keyframes hm-sw-icon { from { opacity: 0; transform: scale(0.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes hm-sw-card-out { to { opacity: 0; transform: translateY(-24px) scale(0.96); } }
@keyframes hm-sw-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
@keyframes hm-mode-ic { 0% { transform: scale(0.4) rotate(-40deg); } 100% { transform: none; } }
@keyframes hm-page-in { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

/* fly-to-cart dot */
.hm-fly-x, .hm-fly-y { position: fixed; left: 0; top: 0; z-index: 2147483000; pointer-events: none; }
.hm-fly-y { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--hm-orange, #f7931e); box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(247, 147, 30, 0.55); }

/* ---------------- responsive ---------------- */
@media (max-width: 1100px) {
  .hm-cats { grid-template-columns: repeat(4, minmax(0, 1fr)); }

}

  .hm-icons { margin-left: auto; }
  .hm-tabs-bar { position: static; }
  .hm-banner-track { grid-auto-columns: 86%; }

  .hm-arrow { display: none; }
}
@media (max-width: 560px) {

  .hm-free { bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); font-size: 12px; }
  .hm-viewcart { padding: 0 16px 0 20px; }
}

/* ---------------- keyframes ---------------- */
@keyframes hm-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes hm-drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes hm-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes hm-pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes hm-bump { 0% { transform: scale(1); } 45% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes hm-expand { from { opacity: 0.4; transform: scaleX(0.6); } to { opacity: 1; transform: none; } }
@keyframes hm-heart { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
@keyframes hm-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }

@keyframes hm-arrow { 0%, 80%, 100% { transform: none; } 88% { transform: translate(2px, -2px); } }

@media (prefers-reduced-motion: reduce) {
  .hm-page *, .hm-page *::before, .hm-page *::after { animation: none !important; transition: none !important; }

.ad-body { padding: 22px; animation: ad-page 420ms var(--ad-ease) both; }
.ad-stack { display: flex; flex-direction: column; gap: 16px; }
.ad-card { background: var(--ad-card); border: 1px solid var(--ad-line); border-radius: 16px; box-shadow: 0 1px 2px rgba(19, 33, 43, 0.04); animation: ad-rise 420ms var(--ad-ease) backwards; animation-delay: calc(var(--i, 0) * 60ms + 40ms); }
.ad-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 18px 6px; flex-wrap: wrap; }
.ad-card-head h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.ad-card-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--ad-muted); }
.ad-card-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ad-sec-h { margin: 0; font-size: 16px; font-weight: 800; }
.ad-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ad-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px 18px 20px; }
.ad-panel { border: 1px solid var(--ad-line); border-radius: 14px; padding: 14px; }
.ad-panel h3 { margin: 0 0 12px; font-size: 14.5px; font-weight: 800; display: flex; flex-direction: column; }
.ad-panel h3 small { font-size: 12px; font-weight: 500; color: var(--ad-muted); }

/* stats */
.ad-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.ad-stat { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--ad-line); border-radius: 16px; padding: 14px 16px 16px; animation: ad-rise 420ms var(--ad-ease) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.ad-stat header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ad-muted); }
.ad-stat-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--tone); background: color-mix(in srgb, var(--tone) 12%, #fff); }
.ad-stat b { display: block; margin: 8px 0 4px; font-size: 27px; font-weight: 800; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; animation: ad-rise 500ms var(--ad-ease) 120ms both; }
.ad-stat-foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ad-muted); }
.ad-delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
.ad-up { color: #14602d; background: #e3f4e9; } .ad-down { color: #9c2f28; background: #fbe9e7; }
.ad-spark { position: absolute; right: 0; bottom: 0; width: 38%; height: 38px; opacity: 0.85; pointer-events: none; }
.ad-mini-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ad-mini-stats > span { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #fff; border: 1px solid var(--ad-line); border-radius: 14px; animation: ad-rise 380ms var(--ad-ease) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
.ad-mini-stats small { font-size: 12px; color: var(--ad-muted); }
.ad-mini-stats b { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ad-mini-stats .ad-warn b { color: var(--ad-amber); } .ad-mini-stats .ad-bad b { color: var(--ad-red); }
.ad-inline-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 14px 0; }
.ad-inline-stats b { font-size: 16px; }

/* ---------------- charts ---------------- */
.ad-chart { position: relative; padding: 4px 12px 10px; }
.ad-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.ad-grid { stroke: #eaeff3; stroke-width: 1; }
.ad-axis { fill: #8b9aa5; font-size: 10.5px; font-weight: 600; }
.ad-cross { stroke: #b9c7d1; stroke-width: 1; stroke-dasharray: 4 4; }
.ad-line { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: ad-draw 1100ms var(--ad-ease) 120ms forwards; }
.ad-bar { transform-origin: center bottom; animation: ad-bar 460ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 26ms + 80ms); transition: opacity 160ms; }
.ad-tip { position: absolute; z-index: 4; transform: translate(-50%, calc(-100% - 12px)); pointer-events: none; background: #13212b; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.6); white-space: nowrap; animation: ad-pop 160ms var(--ad-ease) both; }
.ad-tip b { display: block; margin-bottom: 4px; font-size: 12px; opacity: 0.8; font-weight: 600; }
.ad-tip span { display: flex; align-items: center; gap: 6px; line-height: 1.5; }
.ad-tip i { width: 8px; height: 8px; border-radius: 3px; }
.ad-tip em { margin-left: auto; padding-left: 10px; font-style: normal; font-weight: 800; }
.ad-tip-sub { opacity: 0.7; font-size: 11.5px; }
.ad-legend { display: inline-flex; align-items: center; gap: 14px; font-size: 12.5px; font-weight: 600; color: var(--ad-muted); }
.ad-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ad-legend i { width: 10px; height: 10px; border-radius: 3px; }
.ad-rank { list-style: none; margin: 0; padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.ad-rank li { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 13.5px; animation: ad-rise 380ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 60ms + 120ms); }
.ad-rank-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #33434e; font-weight: 600; }
.ad-rank-bar { height: 12px; border-radius: 6px; background: #eef2f5; overflow: hidden; }
.ad-rank-bar i { display: block; height: 100%; width: var(--w); border-radius: 6px; transform-origin: left; animation: ad-grow-x 700ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 60ms + 200ms); }
.ad-rank b { font-variant-numeric: tabular-nums; font-weight: 800; }
.ad-datatable { padding: 0 18px 18px; max-height: 260px; overflow: auto; }
.ad-datatable table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ad-datatable th { position: sticky; top: 0; background: #fff; text-align: left; padding: 8px 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ad-muted); border-bottom: 1px solid var(--ad-line); }
.ad-datatable td { padding: 7px 10px; border-bottom: 1px solid #f1f4f7; font-variant-numeric: tabular-nums; }

/* ---------------- tables ---------------- */
.ad-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--ad-line); flex-wrap: wrap; }
.ad-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ad-table-wrap { overflow-x: auto; }
.ad-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ad-table th { position: sticky; top: 0; z-index: 1; background: #fbfcfd; text-align: left; padding: 10px 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ad-muted); border-bottom: 1px solid var(--ad-line); white-space: nowrap; }
.ad-table td { padding: 10px 12px; border-bottom: 1px solid #f1f4f7; vertical-align: middle; }
.ad-table tbody tr { animation: ad-row 360ms var(--ad-ease) backwards; animation-delay: calc(var(--i, 0) * 28ms); transition: background-color 160ms; cursor: pointer; }
.ad-table tbody tr:hover { background: #f7fafc; }
.ad-table tbody tr.ad-selected { background: #eef7fc; }
.ad-table tbody tr.ad-row-warn td:first-child { box-shadow: inset 3px 0 0 var(--ad-amber); }
.ad-table tbody tr.ad-row-bad td:first-child { box-shadow: inset 3px 0 0 var(--ad-red); }
.ad-table .ad-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ad-table .ad-check { width: 36px; }
.ad-table input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ad-blue); cursor: pointer; }
.ad-cell-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ad-cell-person b { display: block; font-size: 13.5px; font-weight: 600; }
.ad-cell-person small, .ad-table small { font-size: 12px; color: var(--ad-muted); }
.ad-order-id { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; white-space: nowrap; }
.ad-q { color: var(--ad-orange); } .ad-e { color: var(--ad-blue); }
.ad-when { display: inline-flex; flex-direction: column; align-items: flex-end; }
.ad-when b { font-weight: 700; }
.ad-row-act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.ad-row-act .ad-icon-btn { width: 30px; height: 30px; }
.ad-more { padding: 14px; text-align: center; }
.ad-bulk { display: flex; align-items: center; gap: 12px; padding: 0 16px; max-height: 0; overflow: hidden; background: #eef7fc; transition: max-height 260ms var(--ad-ease), padding 260ms; }
.ad-bulk.ad-show { max-height: 64px; padding: 12px 16px; border-bottom: 1px solid var(--ad-line); }
.ad-thumb { flex: none; width: 38px; height: 38px; border-radius: 10px; background: #f4f7f9; display: grid; place-items: center; padding: 4px; overflow: hidden; }
.ad-thumb img, .ad-thumb svg { width: 100%; height: 100%; object-fit: contain; }
.ad-inline-num { width: 74px; height: 32px; padding: 0 10px; border: 1px solid var(--ad-line); border-radius: 9px; font: inherit; font-size: 13.5px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; outline: none; transition: border-color 180ms, box-shadow 200ms; }
.ad-inline-num:focus { border-color: var(--ad-blue); box-shadow: 0 0 0 3px rgba(10, 120, 171, 0.14); }
.ad-stepper { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--ad-line); border-radius: 9px; overflow: hidden; }
.ad-stepper button { width: 28px; height: 30px; border: 0; background: #fff; font-size: 15px; font-weight: 700; color: var(--ad-blue); transition: background-color 160ms; }
.ad-stepper button:hover { background: #eaf4fa; }
.ad-stepper b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; animation: ad-pop 260ms var(--ad-spring); }

/* ---------------- dashboard lists ---------------- */
.ad-live, .ad-lowstock { list-style: none; margin: 0; padding: 6px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ad-live li { display: flex; align-items: center; gap: 8px; border-radius: 12px; animation: ad-row 360ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 50ms + 80ms); }
.ad-live-main { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px; border: 0; border-radius: 12px; background: none; text-align: left; transition: background-color 160ms; }
.ad-live-main:hover { background: var(--ad-ground); }
.ad-live-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-live-txt b { font-size: 13.5px; }
.ad-live-txt small, .ad-live-meta small { font-size: 12px; color: var(--ad-muted); }
.ad-live-meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.ad-lowstock li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; animation: ad-row 360ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 50ms + 80ms); }
.ad-lowstock li:hover { background: var(--ad-ground); }
.ad-lowstock-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-lowstock-txt b { font-size: 13.5px; font-weight: 600; }
.ad-lowstock-txt small { font-size: 12px; color: var(--ad-muted); }
.ad-qty { flex: none; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #fdf1dc; color: #8a5a06; }
.ad-qty.ad-zero { background: #fbe9e7; color: #9c2f28; }
.ad-sold { flex: none; font-size: 12px; color: var(--ad-muted); width: 88px; text-align: right; }

/* ---------------- riders ---------------- */
.ad-riders { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ad-rider { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ad-rider header { display: flex; align-items: center; gap: 10px; }
.ad-rider header > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-rider header b { font-size: 15px; font-weight: 700; }
.ad-rider header small { font-size: 12px; color: var(--ad-muted); }
.ad-rider.ad-busy { border-color: #ffd9a8; box-shadow: 0 0 0 3px rgba(247, 147, 30, 0.08); }
.ad-rider-jobs { margin: 0; }
.ad-rider-assign { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #fff8ee; font-size: 13px; }
.ad-rider-assign p { margin: 0; }
.ad-rider-idle { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--ad-ground); font-size: 13px; }
.ad-rider footer { display: flex; gap: 8px; }

/* ---------------- drawer, modal, forms ---------------- */
.ad-drawer-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(9, 32, 46, 0.4); display: flex; justify-content: flex-end; animation: ad-fade 200ms ease both; }
.ad-drawer-wrap.ad-out { animation: ad-fade 200ms ease reverse forwards; }
.ad-drawer { width: min(440px, 100vw); height: 100%; display: flex; flex-direction: column; background: var(--ad-ground); box-shadow: -20px 0 50px -30px rgba(0, 0, 0, 0.6); animation: ad-slide 320ms var(--ad-ease) both; }
.ad-drawer-wide { width: min(520px, 100vw); }
.ad-out .ad-drawer { animation: ad-slide 240ms var(--ad-ease) reverse forwards; }
.ad-drawer > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 16px 14px 20px; background: #fff; border-bottom: 1px solid var(--ad-line); }
.ad-drawer > header h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.ad-drawer > header small { font-size: 12.5px; color: var(--ad-muted); }
.ad-drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.ad-drawer > footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; background: #fff; border-top: 1px solid var(--ad-line); }
.ad-drawer-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ad-eta, .ad-paid { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--ad-muted); background: #fff; border: 1px solid var(--ad-line); padding: 4px 10px; border-radius: 999px; }
.ad-dsec { background: #fff; border: 1px solid var(--ad-line); border-radius: 14px; padding: 14px; animation: ad-rise 360ms var(--ad-ease) backwards; animation-delay: 60ms; }
.ad-dsec h4 { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ad-muted); display: flex; align-items: center; gap: 6px; }
.ad-dsec h4 em { font-style: normal; background: var(--ad-ground); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.ad-person { display: flex; align-items: center; gap: 10px; }
.ad-person > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-person b { font-size: 14.5px; font-weight: 700; }
.ad-person small { font-size: 12.5px; color: var(--ad-muted); line-height: 1.5; }
.ad-person-lg { padding: 14px; background: #fff; border: 1px solid var(--ad-line); border-radius: 14px; }
.ad-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.ad-kv span { display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; border-radius: 11px; background: var(--ad-ground); font-size: 13.5px; font-weight: 600; }
.ad-kv small { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ad-muted); }
.ad-span2 { grid-column: 1 / -1; }
.ad-rider-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ad-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--ad-green); }
.ad-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ad-items li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px; background: var(--ad-ground); font-size: 13.5px; }
.ad-items li > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-items small { font-size: 11.5px; color: var(--ad-muted); }
.ad-qty-chip { flex: none; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 8px; background: #fff; border: 1px solid var(--ad-line); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.ad-bill { margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed var(--ad-line); font-size: 13.5px; }
.ad-bill div { display: flex; justify-content: space-between; padding: 3px 0; }
.ad-bill dt { color: var(--ad-muted); } .ad-bill dd { margin: 0; font-variant-numeric: tabular-nums; }
.ad-bill-total { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--ad-line); font-weight: 800; font-size: 15px; }
.ad-timeline { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; }
.ad-timeline li { position: relative; display: flex; gap: 12px; padding: 0 0 16px 0; animation: ad-row 340ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 70ms + 100ms); }
.ad-timeline li:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--ad-line); }
.ad-timeline li.ad-done:not(:last-child)::before { background: #bfe3cc; }
.ad-timeline i { position: relative; z-index: 1; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ad-line); background: #fff; display: grid; place-items: center; color: #fff; }
.ad-timeline .ad-done i { background: var(--ad-green); border-color: var(--ad-green); }
.ad-timeline .ad-cancelled i { background: var(--ad-red); border-color: var(--ad-red); }
.ad-timeline .ad-now i { box-shadow: 0 0 0 4px rgba(26, 127, 60, 0.15); }
.ad-timeline span { display: flex; flex-direction: column; }
.ad-timeline b { font-size: 13.5px; font-weight: 700; }
.ad-timeline small { font-size: 12px; color: var(--ad-muted); }
.ad-prod-hero { display: flex; align-items: center; gap: 14px; padding: 14px; background: #fff; border: 1px solid var(--ad-line); border-radius: 14px; }
.ad-prod-hero .ad-thumb { width: 72px; height: 72px; border-radius: 14px; }
.ad-prod-hero b { font-size: 20px; font-weight: 800; }
.ad-prod-hero s { margin-left: 8px; color: var(--ad-muted); font-size: 14px; }
.ad-prod-hero small { display: block; margin-top: 4px; font-size: 12.5px; color: var(--ad-muted); }

.ad-modal-wrap { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 16px; background: rgba(9, 32, 46, 0.45); animation: ad-fade 180ms ease both; }
.ad-modal { width: min(400px, 100%); background: #fff; border-radius: 18px; padding: 24px 22px 18px; text-align: center; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5); animation: ad-pop 300ms var(--ad-spring) both; }
.ad-modal-ic { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: #e6f1f8; color: var(--ad-blue); }
.ad-danger-ic { background: #fbe9e7; color: var(--ad-red); }
.ad-modal h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
.ad-modal p { margin: 0 0 16px; font-size: 14px; color: #47575f; line-height: 1.5; }
.ad-modal > div { display: flex; gap: 10px; }
.ad-modal > div > * { flex: 1; }
.ad-reason { margin-top: 10px; width: 100%; height: 38px; border: 1px solid var(--ad-line); border-radius: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; }

.ad-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ad-form-pad { padding: 16px 18px 20px; }
.ad-field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--ad-muted); }
.ad-field input, .ad-field select { height: 40px; border: 1px solid var(--ad-line); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 500; color: var(--ad-ink); background: #fff; outline: none; transition: border-color 180ms, box-shadow 200ms; }
.ad-field input:focus, .ad-field select:focus { border-color: var(--ad-blue); box-shadow: 0 0 0 3px rgba(10, 120, 171, 0.14); }
.ad-field-in { position: relative; display: flex; }
.ad-field-in input { flex: 1; }
.ad-field-in em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--ad-muted); }
.ad-field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ad-narrow { width: 110px; }
.ad-narrow input { width: 100%; height: 38px; border: 1px solid var(--ad-line); border-radius: 10px; padding: 0 26px 0 10px; font: inherit; text-align: right; font-variant-numeric: tabular-nums; }
.ad-hint { display: flex; align-items: flex-start; gap: 7px; margin: 4px 0 0; font-size: 12.5px; color: var(--ad-muted); line-height: 1.5; }
.ad-hint .hm-ic { flex: none; margin-top: 1px; }
.ad-rows { display: flex; flex-direction: column; padding: 6px 18px 18px; }
.ad-row-set { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f1f4f7; animation: ad-row 340ms var(--ad-ease) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
.ad-row-set:last-child { border-bottom: 0; }
.ad-row-ic { flex: none; width: 36px; height: 36px; border-radius: 11px; background: var(--ad-ground); color: #3f5361; display: grid; place-items: center; }
.ad-row-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ad-row-txt b { font-size: 14px; font-weight: 700; }
.ad-row-txt small { font-size: 12.5px; color: var(--ad-muted); }

/* ---------------- offers + reviews ---------------- */
.ad-coupons { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 16px 18px 20px; }
.ad-coupon { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--ad-line); border-radius: 14px; background: #fff; animation: ad-rise 380ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 60ms); transition: border-color 200ms, box-shadow 200ms; }
.ad-coupon:hover { border-color: #c5d5df; box-shadow: 0 10px 22px -18px rgba(11, 60, 88, 0.7); }
.ad-coupon.ad-off { opacity: 0.6; }
.ad-coupon-stub { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 11px; background: #eaf4fa; color: #08516f; }
.ad-coupon-stub b { font-size: 12px; font-weight: 800; letter-spacing: 0.03em; }
.ad-coupon-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ad-coupon-body > b { font-size: 14.5px; font-weight: 700; }
.ad-coupon-body small { font-size: 12.5px; color: var(--ad-muted); }
.ad-progress { height: 7px; margin: 7px 0 2px; border-radius: 7px; background: #eef2f5; overflow: hidden; }
.ad-progress i { display: block; height: 100%; width: var(--p); border-radius: inherit; background: linear-gradient(90deg, var(--ad-orange), #ffb45c); transform-origin: left; animation: ad-grow-x 800ms var(--ad-ease) 200ms backwards; }
.ad-coupon-act { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
.ad-reviews { list-style: none; margin: 0; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.ad-reviews li { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--ad-line); border-radius: 14px; animation: ad-row 360ms var(--ad-ease) backwards; animation-delay: calc(var(--i) * 50ms); }
.ad-review-body { flex: 1; min-width: 0; }
.ad-review-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ad-review-top b { font-size: 14.5px; font-weight: 700; }
.ad-review-top small { font-size: 12px; color: var(--ad-muted); }
.ad-review-body p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.55; color: #3a4a55; }
.ad-review-act { display: flex; flex-direction: column; gap: 6px; }
.ad-stars { font-size: 12px; font-weight: 800; color: #fff; border-radius: 7px; padding: 2px 7px; background: var(--ad-green); }
.ad-stars.ad-s3 { background: #d99400; } .ad-stars.ad-s2, .ad-stars.ad-s1 { background: var(--ad-red); }

.ad-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 38px 20px 42px; }
.ad-empty > span { width: 54px; height: 54px; border-radius: 16px; background: var(--ad-ground); color: var(--ad-blue); display: grid; place-items: center; animation: ad-pop 420ms var(--ad-spring) both; }
.ad-empty b { margin-top: 6px; font-size: 16px; font-weight: 800; }
.ad-empty p { margin: 0 0 8px; font-size: 13.5px; color: var(--ad-muted); }

.ad-toast { position: fixed; left: 50%; bottom: 26px; z-index: 120; display: inline-flex; align-items: center; gap: 8px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; padding: 11px 18px; border-radius: 999px; background: #13212b; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 18px 36px -18px rgba(0, 0, 0, 0.8); transition: transform 320ms var(--ad-spring), opacity 220ms; }
.ad-toast.ad-show { transform: translate(-50%, 0); opacity: 1; }
.ad-toast.bad { background: #8f2f28; }
.ad-only-m { display: none; }

/* ---------------- responsive ---------------- */
@media (max-width: 1180px) {
  .ad-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-grid-2, .ad-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .ad-app, .ad-collapsed { grid-template-columns: minmax(0, 1fr); }
  .ad-side { position: fixed; left: 0; top: 0; z-index: 70; width: 262px; transform: translateX(-100%); transition: transform 320ms var(--ad-ease); }
  .ad-nav-open .ad-side { transform: none; }
  .ad-nav-open .ad-nav-back { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(9, 32, 46, 0.45); animation: ad-fade 200ms ease both; }
  .ad-collapse { display: none; }
  .ad-only-m { display: grid; }
  .ad-top { padding: 10px 14px; flex-wrap: wrap; }
  .ad-top-search { order: 5; flex-basis: 100%; max-width: none; margin-left: 0; }
  .ad-body { padding: 14px; }
  .ad-mini-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-toolbar { align-items: stretch; }
  .ad-toolbar-right { justify-content: flex-start; }
  .ad-drawer, .ad-drawer-wide { width: 100vw; }
  .ad-form, .ad-kv, .ad-field-row { grid-template-columns: minmax(0, 1fr); }
  .ad-rank li { grid-template-columns: 96px minmax(0, 1fr) auto; }
  .ad-reviews li { flex-wrap: wrap; }
  .ad-review-act { flex-direction: row; width: 100%; }
}
@media (max-width: 680px) {
  .ad-live li { flex-wrap: wrap; row-gap: 6px; padding-bottom: 8px; }
  .ad-live-main { display: grid; width: 100%; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "av txt" "pill meta"; row-gap: 8px; column-gap: 10px; align-items: center; }
  .ad-live-main > .ad-avatar { grid-area: av; }
  .ad-live-txt { grid-area: txt; }
  .ad-live-meta { grid-area: meta; flex-direction: row; align-items: center; justify-content: flex-end; gap: 8px; }
  .ad-live-main .ad-pill { grid-area: pill; justify-self: start; }
  .ad-live li > .ad-btn { width: 100%; }
  .ad-lowstock li { flex-wrap: wrap; row-gap: 4px; }
  .ad-lowstock-txt { flex: 1 1 100%; }
  .ad-sold { width: auto; margin-left: auto; }
}
@media (max-width: 560px) {
  .ad-stats, .ad-mini-stats { grid-template-columns: minmax(0, 1fr); }
  .ad-tabs { overflow-x: auto; max-width: 100%; }
  .ad-top-title h1 { font-size: 17px; }
}

/* ---------------- keyframes ---------------- */
@keyframes ad-page { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes ad-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes ad-row { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes ad-pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes ad-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ad-slide { from { transform: translateX(28px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes ad-draw { to { stroke-dashoffset: 0; } }
@keyframes ad-bar { from { transform: scaleY(0); opacity: 0.3; } to { transform: none; opacity: 1; } }
@keyframes ad-grow-x { from { transform: scaleX(0); } to { transform: none; } }
@keyframes ad-grow-y { from { transform: scaleY(0); } to { transform: none; } }
@keyframes ad-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (prefers-reduced-motion: reduce) {
  .ad-app *, .ad-drawer-wrap *, .ad-modal-wrap * { animation: none !important; transition: none !important; }
}
