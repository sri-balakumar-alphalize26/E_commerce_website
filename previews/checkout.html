<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>369 Mart Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,700..800&display=swap">
<style>:root{color-scheme:light}*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#fff;color:#13212b;font-family:Inter,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* ==========================================================================
   369 Mart — Home. Scoped under .hm-* . Type: Inter (same family Flipkart's web store uses).
   ========================================================================== */
.hm-page {
  --hm-ink: #13212b;
  --hm-muted: #6b7a86;
  --hm-line: #e7ecf0;
  --hm-soft: #f4f6f8;
  --hm-ground: #ffffff;
  --hm-navy: #0b4a6e;
  --hm-blue: #0a78ab;
  --hm-blue-d: #08658f;
  --hm-orange: #f7931e;
  --hm-orange-soft: #fff1de;
  --hm-green: #1f8a3c;
  --hm-red: #c8433a;
  --hm-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --hm-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --hm-card-w: 172px;
  /* mode accent — Quick = orange, Express = ocean blue */
  --hm-accent: #f7931e;
  --hm-accent-2: #ef6f1a;
  --hm-accent-soft: #fff1de;
  --hm-accent-line: #ffd9a8;
  --hm-accent-ink: #8a4a00;

  background: var(--hm-ground);
  color: var(--hm-ink);
  font-family: var(--font-inter, "Inter"), ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
  padding-bottom: 24px;
  transition: padding-bottom 300ms var(--hm-ease);
}
.hm-page.hm-has-cart { padding-bottom: 96px; }
.hm-page[data-mode="all"] {
  --hm-accent: #0a78ab;
  --hm-accent-2: #0b4a6e;
  --hm-accent-soft: #e6f2f9;
  --hm-accent-line: #bcdcee;
  --hm-accent-ink: #0b4a6e;
}
.hm-page *, .hm-page *::before, .hm-page *::after { box-sizing: border-box; }
.hm-page button { font: inherit; color: inherit; cursor: pointer; }
.hm-page a { color: inherit; }
.hm-ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hm-ic.hm-fill { fill: currentColor; stroke: none; }
.hm-art { width: 100%; height: 100%; display: block; }
.hm-page :focus-visible { outline: 2px solid var(--hm-orange); outline-offset: 2px; }
.hm-wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; }

/* ---------------- header ---------------- */
.hm-hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #fff;
  transition: box-shadow 240ms var(--hm-ease);
}
.hm-hdr.hm-scrolled { box-shadow: 0 6px 18px -12px rgba(19, 33, 43, 0.35); }
.hm-hdr-row { display: flex; align-items: center; gap: 16px; height: 64px; }
.hm-logo { display: flex; align-items: center; text-decoration: none; font-size: 24px; font-weight: 800; letter-spacing: -0.045em; color: var(--hm-navy) !important; }
.hm-logo-arrow { width: 19px; height: 19px; fill: none; stroke: var(--hm-orange); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; margin: 0 1px; animation: hm-arrow 3.6s var(--hm-ease) 1s infinite; }
.hm-mode { position: relative; display: flex; background: var(--hm-soft); border-radius: 999px; padding: 3px; }
.hm-mode-thumb {
  position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px;
  background: linear-gradient(135deg, var(--hm-accent), var(--hm-accent-2));
  box-shadow: 0 5px 12px -6px var(--hm-accent);
  transition: transform 520ms var(--hm-spring), width 520ms var(--hm-spring), background 400ms, box-shadow 400ms;
}
.hm-mode button { position: relative; display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; transition: color 300ms; }
.hm-mode button i { font-style: italic; font-weight: 800; }
.hm-mode button .hm-ic { transition: transform 420ms var(--hm-spring); }
.hm-mode button[aria-selected="true"] { color: #fff !important; }
.hm-mode button[aria-selected="true"] .hm-ic { animation: hm-mode-ic 560ms var(--hm-spring); }
.hm-mode button[aria-selected="false"] { color: var(--hm-ink); }
.hm-mode button[aria-selected="false"]:hover .hm-ic { transform: rotate(-12deg) scale(1.15); }
.hm-loc-ic { display: grid; place-items: center; color: var(--hm-ink); animation: hm-pop 460ms var(--hm-spring) both; }
.hm-loc { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; min-width: 0; max-width: 230px; padding: 4px 6px; border-radius: 10px; }
.hm-loc:hover { background: var(--hm-soft); }

.hm-loc-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.hm-loc-txt b { display: inline-flex; align-items: center; gap: 2px; font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
.hm-loc-txt small { font-size: 12px; color: var(--hm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-search {
  flex: 1; max-width: 520px; margin-left: auto; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border: 1px solid transparent; border-radius: 999px; background: var(--hm-soft); color: var(--hm-muted); text-align: left; font-size: 15px; font-weight: 400;
  transition: border-color 200ms, background-color 200ms, box-shadow 240ms var(--hm-ease);
}
.hm-search:hover { background: #fff; border-color: var(--hm-line); box-shadow: 0 4px 14px -10px rgba(19, 33, 43, 0.4); }
.hm-search-ph { display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.hm-roll { display: inline-grid; height: 1.4em; overflow: hidden; }
.hm-roll > span { grid-area: 1 / 1; line-height: 1.4em; transition: transform 460ms var(--hm-ease), opacity 360ms; opacity: 0; transform: translateY(90%); }
.hm-roll > span[data-s="in"] { opacity: 1; transform: none; }
.hm-roll > span[data-s="out"] { transform: translateY(-90%); }
.hm-icons { display: flex; align-items: center; gap: 4px; }
.hm-iconbtn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; color: var(--hm-ink); transition: background-color 180ms; }
.hm-iconbtn:hover { background: var(--hm-soft); }
.hm-badge {
  position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center;
  background: var(--hm-red); color: #fff; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; border: 2px solid #fff;
  animation: hm-pop 420ms var(--hm-spring) both;
}
.hm-avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 0; margin-left: 4px; background: linear-gradient(145deg, #d7ecf7, #a9d2e8); color: var(--hm-navy); }

/* tabs */
.hm-tabs-bar { background: #fff; border-bottom: 1px solid var(--hm-line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 49; }
.hm-tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
.hm-tabs::-webkit-scrollbar { display: none; }
.hm-tab-ind { position: absolute; left: 0; top: 8px; bottom: 8px; border-radius: 999px; background: var(--hm-accent-soft); box-shadow: inset 0 0 0 1px var(--hm-accent-line); transition: transform 380ms var(--hm-spring), width 380ms var(--hm-spring); }
.hm-tabs button {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 999px;
  padding: 7px 14px; font-size: 15px; font-weight: 500; letter-spacing: -0.005em; color: #3a4750; transition: color 200ms;
  animation: hm-drop 480ms var(--hm-ease) both; animation-delay: calc(var(--i) * 40ms);
}
.hm-tabs button:hover { color: var(--hm-ink); }
.hm-tabs button[aria-selected="true"] { color: var(--hm-accent-ink); font-weight: 600; }

/* ---------------- main ---------------- */
.hm-main { display: flex; flex-direction: column; gap: 30px; padding-top: 18px; }

/* banners */
.hm-banners { position: relative; }
.hm-banner-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 16px) / 2); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hm-banner-track::-webkit-scrollbar { display: none; }
.hm-banner {
  position: relative; overflow: hidden; isolation: isolate; scroll-snap-align: start; display: flex; align-items: stretch; min-height: 176px;
  border-radius: 16px; text-decoration: none; color: #fff; padding: 22px 24px;
  animation: hm-rise 620ms var(--hm-ease) backwards; animation-delay: calc(120ms + var(--i) * 90ms);
  transition: transform 300ms var(--hm-ease), box-shadow 300ms;
}
.hm-page .hm-banner { color: #fff; }
.hm-banner:hover { transform: translateY(-3px); box-shadow: 0 18px 30px -22px rgba(19, 33, 43, 0.6); }
.hm-banner::before { content: ""; position: absolute; z-index: -1; width: 260px; aspect-ratio: 1; right: -40px; top: -60px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.hm-tone-green  { background: linear-gradient(120deg, #13613c, #2d9a5a); }
.hm-tone-navy   { background: linear-gradient(120deg, #083b59, #0a78ab); }
.hm-tone-brown  { background: linear-gradient(120deg, #7a4326, #b8774a); }
.hm-tone-orange { background: linear-gradient(120deg, #d86a0c, #f7a23a); }
.hm-tone-teal   { background: linear-gradient(120deg, #0e5a63, #1c8c8f); }
.hm-tone-indigo { background: linear-gradient(120deg, #26306b, #4a5bb0); }
.hm-banner-copy { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; max-width: 58%; }
.hm-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.hm-banner strong { font-size: clamp(20px, 2.1vw, 27px); line-height: 1.12; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; margin-top: 4px; }
.hm-note { font-size: 14.5px; font-weight: 600; opacity: 0.92; margin-top: 2px; }
.hm-shop { margin-top: auto; display: inline-flex; align-items: center; gap: 2px; background: #fff; color: var(--hm-ink); font-size: 13px; font-weight: 800; border-radius: 999px; padding: 7px 12px 7px 14px; transition: gap 200ms; }
.hm-banner:hover .hm-shop { gap: 6px; }
.hm-banner-art { position: absolute; right: 8px; bottom: 6px; width: 46%; height: 82%; }
.hm-banner-art > span { position: absolute; width: 58%; aspect-ratio: 1.2; bottom: calc(var(--k) * 10%); right: calc(var(--k) * 30%); filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.18)); animation: hm-float 5s ease-in-out infinite; animation-delay: calc(var(--k) * -1.6s); }
.hm-banner-art > span:first-child { width: 66%; z-index: 2; }

.hm-inline-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.hm-inline-banners .hm-banner { min-height: 150px; }

/* arrows */
.hm-arrow {
  position: absolute; top: 50%; z-index: 5; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: #fff; color: var(--hm-ink); box-shadow: 0 4px 14px -4px rgba(19, 33, 43, 0.35); animation: hm-pop 260ms var(--hm-spring) both;
  transition: transform 180ms var(--hm-ease);
}
.hm-arrow:hover { transform: scale(1.08); }
.hm-arrow-l { left: -14px; }
.hm-arrow-r { right: -14px; }

/* category strip */
.hm-cats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }
.hm-cat { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 500; color: #212121; text-align: center; line-height: 1.25; opacity: 0; transform: translateY(12px); transition: opacity 500ms var(--hm-ease), transform 500ms var(--hm-ease); transition-delay: calc(var(--i) * 45ms); }
.hm-cats.hm-in .hm-cat { opacity: 1; transform: none; }
.hm-cat-img { width: 100%; max-width: 104px; aspect-ratio: 1; border-radius: 20px; padding: 14%; display: grid; place-items: center; transition: transform 300ms var(--hm-spring), box-shadow 300ms; }
.hm-cat:hover .hm-cat-img { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 20px -16px rgba(19, 33, 43, 0.6); }

/* rails */
.hm-rail-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.hm-rail-head h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.hm-rail-head p { margin: 3px 0 0; font-size: 14px; color: var(--hm-muted); }
.hm-viewall { display: inline-flex; align-items: center; gap: 1px; font-size: 14px; font-weight: 700; color: var(--hm-blue) !important; text-decoration: none; white-space: nowrap; }
.hm-viewall .hm-ic { transition: transform 200ms var(--hm-ease); }
.hm-viewall:hover .hm-ic { transform: translateX(3px); }
.hm-rail-box { position: relative; }
.hm-rail-box .hm-arrow { top: calc(var(--hm-card-w) * 0.5); }
.hm-rail-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 10px; scrollbar-width: none; }
.hm-rail-track::-webkit-scrollbar { display: none; }

/* card */
.hm-card {
  flex: 0 0 var(--hm-card-w); scroll-snap-align: start; display: flex; flex-direction: column; background: #fff;
  border-radius: 14px; border: 1px solid var(--hm-line);
  opacity: 0; transform: translateX(18px);
  transition: opacity 520ms var(--hm-ease), transform 520ms var(--hm-ease), box-shadow 260ms, border-color 260ms;
  transition-delay: calc(min(var(--i), 8) * 50ms);
}
.hm-rail.hm-in .hm-card { opacity: 1; transform: none; }
.hm-rail.hm-in .hm-card:hover { transition-delay: 0s; box-shadow: 0 14px 28px -20px rgba(19, 33, 43, 0.5); border-color: #d6dfe6; }
.hm-card-img { position: relative; aspect-ratio: 1; border-radius: 13px 13px 0 0; overflow: hidden; background: linear-gradient(180deg, #f7f9fa 55%, #e9eef1); padding: 12% 10% 8%; }
.hm-card-img img, .hm-card-img .hm-art { width: 100%; height: 100%; object-fit: contain; transition: transform 460ms var(--hm-ease); }
.hm-card:hover .hm-card-img img, .hm-card:hover .hm-card-img .hm-art { transform: scale(1.06); }
.hm-heart { position: absolute; top: 6px; left: 6px; width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; color: #b7c2ca; }
.hm-heart .hm-ic { fill: rgba(255, 255, 255, 0.85); transition: fill 200ms, stroke 200ms; }
.hm-heart:hover { color: var(--hm-muted); }
.hm-heart.hm-liked { color: #e23d4b; }
.hm-heart.hm-liked .hm-ic { fill: #e23d4b; animation: hm-heart 460ms var(--hm-spring); }
.hm-card-cta { position: absolute; top: 8px; right: 8px; z-index: 2; }
.hm-add {
  height: 30px; min-width: 58px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--hm-blue); background: #fff;
  color: var(--hm-blue) !important; font-weight: 700; font-size: 13.5px; box-shadow: 0 2px 6px -3px rgba(10, 120, 171, 0.5);
  transition: background-color 180ms, color 180ms, transform 160ms var(--hm-ease);
  animation: hm-fade 300ms var(--hm-ease) both;
}
.hm-add:hover { background: #eaf5fb; }
.hm-add:active { transform: scale(0.92); }
.hm-stepper {
  height: 30px; display: flex; align-items: center; border-radius: 8px; background: var(--hm-blue); color: #fff; overflow: hidden;
  box-shadow: 0 4px 10px -5px rgba(8, 101, 143, 0.8); transform-origin: right center; animation: hm-expand 320ms var(--hm-spring) both;
}
.hm-stepper button { width: 26px; height: 100%; border: 0; background: none; color: #fff !important; font-size: 17px; font-weight: 700; line-height: 1; }
.hm-stepper button:hover { background: rgba(255, 255, 255, 0.14); }
.hm-stepper-n { min-width: 20px; text-align: center; font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; animation: hm-bump 300ms var(--hm-spring); }
.hm-notify { height: 30px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 8px; border: 1.5px solid #c9d4dc; background: #fff; color: #51616d !important; font-size: 12.5px; font-weight: 700; }
.hm-notify.hm-done { border-color: var(--hm-green); color: var(--hm-green) !important; animation: hm-bump 320ms var(--hm-spring); }
.hm-off { position: absolute; left: 8px; bottom: 8px; background: var(--hm-green); color: #fff; font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 3px 6px; letter-spacing: 0.02em; }
.hm-off.hm-new { background: var(--hm-navy); }
.hm-rail.hm-in .hm-off { animation: hm-pop 460ms var(--hm-spring) both; animation-delay: calc(min(var(--i), 8) * 50ms + 360ms); }
.hm-veg { position: absolute; right: 8px; bottom: 8px; width: 16px; height: 16px; border: 1.5px solid var(--hm-green); border-radius: 3px; background: #fff; display: grid; place-items: center; }
.hm-veg i { width: 7px; height: 7px; border-radius: 50%; background: var(--hm-green); }
.hm-oos .hm-card-img .hm-art, .hm-oos .hm-card-img img { filter: grayscale(0.85); opacity: 0.55; }
.hm-oos-tag { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); white-space: nowrap; background: rgba(19, 33, 43, 0.78); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
.hm-card-body { display: flex; flex-direction: column; gap: 3px; padding: 0 10px 10px; flex: 1; }
.hm-unit { text-align: center; font-size: 12.5px; color: var(--hm-muted); padding: 6px 0; margin: 0 -10px 4px; border-bottom: 1px solid var(--hm-line); }
.hm-name { margin: 0; font-size: 14px; font-weight: 400; color: #212121; letter-spacing: -0.005em; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.hm-subnote { font-size: 12px; color: var(--hm-muted); margin-top: -2px; }
.hm-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; margin-top: auto; padding-top: 4px; font-variant-numeric: tabular-nums; }
.hm-price b { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
.hm-price s { font-size: 12px; color: var(--hm-muted); }
.hm-price small { font-size: 11px; color: var(--hm-muted); }
.hm-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 16px; }
.hm-quick { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #7b8993; }
.hm-quick .hm-ic { color: var(--hm-orange); }
.hm-ship { color: #3d6f8c; }
.hm-ship .hm-ic { color: var(--hm-blue); }
.hm-low { font-size: 11px; font-weight: 700; color: #c9620c; }

/* free delivery pill */
.hm-free {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 60; display: flex; align-items: center; gap: 10px;
  max-width: calc(100vw - 32px); padding: 7px 16px 7px 7px; border-radius: 999px;
  background: rgba(233, 245, 252, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid #cfe6f3;
  box-shadow: 0 10px 24px -16px rgba(8, 101, 143, 0.7); font-size: 13px; color: var(--hm-ink);
  transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
  transition: transform 460ms var(--hm-spring), opacity 300ms, background-color 300ms, border-color 300ms;
}
.hm-free.hm-show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.hm-free-ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--hm-blue); }
.hm-free.hm-show .hm-free-ic .hm-ic { animation: hm-ride 1.6s ease-in-out infinite; }
.hm-free-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hm-free-txt > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-free-txt b { font-weight: 800; }
.hm-free-bar { display: block; height: 4px; border-radius: 4px; background: rgba(10, 120, 171, 0.15); overflow: hidden; }
.hm-free-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--hm-blue), #3fb0e0); transition: width 520ms var(--hm-ease); }
.hm-free-done { background: rgba(230, 246, 236, 0.95); border-color: #bfe3cb; }
.hm-free-done .hm-free-ic { color: var(--hm-green); animation: hm-pop 420ms var(--hm-spring); }
.hm-free-done .hm-free-ic .hm-ic { animation: none !important; }
.hm-free-done .hm-free-bar i { background: var(--hm-green); }

/* cart bar */
.hm-cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #fff; border-top: 1px solid var(--hm-line);
  box-shadow: 0 -10px 24px -20px rgba(19, 33, 43, 0.5); padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(110%); transition: transform 440ms var(--hm-spring);
}
.hm-cartbar.hm-show { transform: none; }
.hm-cartbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 66px; }
.hm-cartbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hm-thumbs { display: flex; padding-left: 10px; }
.hm-thumb { width: 42px; height: 42px; margin-left: -10px; border-radius: 10px; background: var(--hm-soft); border: 2px solid #fff; box-shadow: 0 2px 6px -3px rgba(19, 33, 43, 0.4); padding: 4px; animation: hm-pop 380ms var(--hm-spring) both; }
.hm-thumb img { width: 100%; height: 100%; object-fit: contain; }
.hm-cartbar-txt { display: flex; flex-direction: column; line-height: 1.2; }
.hm-cartbar-txt b { font-size: 15.5px; font-weight: 700; }
.hm-cartbar-txt small { font-size: 13px; color: var(--hm-muted); font-variant-numeric: tabular-nums; }
.hm-count-pop { display: inline-block; animation: hm-bump 320ms var(--hm-spring); }
.hm-viewcart {
  display: inline-flex; align-items: center; gap: 4px; height: 46px; padding: 0 22px 0 26px; border: 0; border-radius: 999px;
  background: linear-gradient(180deg, #0c86be, var(--hm-blue-d)); color: #fff !important; font-size: 15.5px; font-weight: 700;
  box-shadow: 0 10px 20px -12px rgba(8, 101, 143, 0.9); transition: transform 160ms var(--hm-ease), gap 200ms;
}
.hm-viewcart:hover { gap: 8px; }
.hm-viewcart:active { transform: scale(0.97); }

/* ---------------- Quick <-> Express switch ---------------- */
.hm-switch {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; color: #fff; pointer-events: all;
  background: radial-gradient(120% 90% at var(--x) var(--y), #ffb14a 0%, #f7931e 38%, #e8631a 100%);
}
.hm-switch[data-to="all"] { background: radial-gradient(120% 90% at var(--x) var(--y), #1b9ad2 0%, #0a78ab 40%, #083b59 100%); }
.hm-switch::before {
  content: ""; position: absolute; inset: 0; opacity: 0.16;
  background-image: radial-gradient(#fff 1.2px, transparent 1.3px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent); mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent);
}
.hm-switch-in   { animation: hm-sw-in 520ms cubic-bezier(0.7, 0, 0.25, 1) both; }
.hm-switch-hold { clip-path: none; }
.hm-switch-out  { animation: hm-sw-out 560ms cubic-bezier(0.65, 0, 0.35, 1) both; }
.hm-switch-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 24px; }
.hm-switch-ic {
  width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; margin-bottom: 8px;
  background: rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 18px 30px -18px rgba(0, 0, 0, 0.5);
  animation: hm-sw-icon 620ms var(--hm-spring) 180ms both;
}
.hm-switch-card strong { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -0.045em; line-height: 1; animation: hm-rise 460ms var(--hm-ease) 260ms both; }
.hm-switch[data-to="quick"] .hm-switch-card strong { font-style: italic; }
.hm-switch-card > span:not(.hm-switch-ic) { font-size: 15px; font-weight: 600; opacity: 0.9; animation: hm-rise 460ms var(--hm-ease) 330ms both; }
.hm-switch-bar { display: block; width: 120px; height: 4px; margin-top: 14px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); overflow: hidden; position: relative; }
.hm-switch-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #fff; animation: hm-sw-load 900ms ease-in-out infinite; }
.hm-switch-out .hm-switch-card { animation: hm-sw-card-out 300ms var(--hm-ease) both; }

/* new page settles in under the lifting curtain */
.hm-page[data-mode] .hm-main { animation: hm-page-in 620ms var(--hm-ease) both; }

@keyframes hm-sw-in { from { clip-path: circle(0px at var(--x) var(--y)); } to { clip-path: circle(150vmax at var(--x) var(--y)); } }
@keyframes hm-sw-out {
  from { transform: translateY(0); border-radius: 0; }
  to { transform: translateY(-104%); border-radius: 0 0 50% 50% / 0 0 14vh 14vh; }
}
@keyframes hm-sw-icon { from { opacity: 0; transform: scale(0.4) rotate(-30deg); } to { opacity: 1; transform: none; } }
@keyframes hm-sw-card-out { to { opacity: 0; transform: translateY(-24px) scale(0.96); } }
@keyframes hm-sw-load { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
@keyframes hm-mode-ic { 0% { transform: scale(0.4) rotate(-40deg); } 100% { transform: none; } }
@keyframes hm-page-in { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

/* fly-to-cart dot */
.hm-fly-x, .hm-fly-y { position: fixed; left: 0; top: 0; z-index: 2147483000; pointer-events: none; }
.hm-fly-y { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--hm-orange, #f7931e); box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(247, 147, 30, 0.55); }

/* ---------------- responsive ---------------- */
@media (max-width: 1100px) {
  .hm-cats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hm-hide-sm { display: none !important; }
}
@media (max-width: 860px) {
  .hm-mode { display: none; }
  .hm-hdr-row { flex-wrap: wrap; height: auto; padding-block: 10px; gap: 8px 12px; }
  .hm-search { order: 5; flex-basis: 100%; max-width: none; margin-left: 0; }
  .hm-icons { margin-left: auto; }
  .hm-tabs-bar { position: static; }
  .hm-banner-track { grid-auto-columns: 86%; }
  .hm-inline-banners { grid-template-columns: 1fr; }
  .hm-arrow { display: none; }
}
@media (max-width: 560px) {
  .hm-page { --hm-card-w: 146px; }
  .hm-wrap { padding-inline: 16px; }
  .hm-logo { font-size: 20px; }
  .hm-hdr-row { gap: 8px; }
  .hm-loc { flex: 1 1 0; max-width: none; padding: 4px; }
  .hm-loc-bolt { display: none; }
  .hm-icons { gap: 0; }
  .hm-main { gap: 24px; }
  .hm-rail-head h2 { font-size: 18px; }
  .hm-banner { min-height: 150px; padding: 18px; }
  .hm-banner-copy { max-width: 62%; }
  .hm-cats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; }
  .hm-cat { font-size: 11.5px; }
  .hm-cat-img { border-radius: 16px; }
  .hm-free { bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); font-size: 12px; }
  .hm-viewcart { padding: 0 16px 0 20px; }
}

/* ---------------- keyframes ---------------- */
@keyframes hm-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes hm-drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes hm-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes hm-pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes hm-bump { 0% { transform: scale(1); } 45% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes hm-expand { from { opacity: 0.4; transform: scaleX(0.6); } to { opacity: 1; transform: none; } }
@keyframes hm-heart { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
@keyframes hm-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
@keyframes hm-ride { 0%, 100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
@keyframes hm-arrow { 0%, 80%, 100% { transform: none; } 88% { transform: translate(2px, -2px); } }

@media (prefers-reduced-motion: reduce) {
  .hm-page *, .hm-page *::before, .hm-page *::after { animation: none !important; transition: none !important; }
  .hm-card, .hm-cat { opacity: 1 !important; transform: none !important; }
}

/* ==========================================================================

.lp-gps:hover { border-color: var(--hm-blue); }

.lp-gps-ic { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--hm-blue); color: #fff; }
.lp-gps-ic::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--hm-blue); opacity: 0; }
.lp-busy .lp-gps-ic .hm-ic { animation: ct-spin 1.2s linear infinite; }
.lp-busy .lp-gps-ic::after { animation: lp-radar 1.1s ease-out infinite; }
.lp-ok { border-color: #bfe3cb; background: #eef9f1; }

.lp-gps-txt small { font-size: 12px; color: var(--hm-muted); }

.lp-pin-form label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.lp-pin-row { display: flex; height: 42px; border: 1.5px solid var(--hm-line); border-radius: 10px; overflow: hidden; transition: border-color 180ms, box-shadow 200ms; }

.lp-pin-row input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 12px; font: inherit; font-size: 15px; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
.lp-pin-row input::placeholder { letter-spacing: 0; color: #9aabb8; }
.lp-pin-row button { flex: none; min-width: 78px; border: 0; background: var(--hm-navy); color: #fff !important; font-weight: 700; font-size: 13.5px; display: grid; place-items: center; }
.lp-shake { animation: si-shake-lp 420ms var(--hm-ease); border-color: var(--hm-red); }
.lp-spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.4); border-top-color: #fff; animation: ct-spin 700ms linear infinite; }
.lp-result { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 13px; font-weight: 600; animation: hm-rise 300ms var(--hm-ease); }
.lp-good { color: var(--hm-green); } .lp-bad { color: var(--hm-red); }

.lp-saved h4 { margin: 2px 0 8px; font-size: 13px; font-weight: 700; color: var(--hm-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.lp-saved ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lp-addr { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--hm-line); background: #fff; text-align: left; color: var(--hm-ink) !important; transition: border-color 200ms, background-color 200ms, transform 160ms var(--hm-ease); }
.lp-addr:hover { border-color: #c3d3de; }
.lp-addr:active { transform: scale(0.98); }
.lp-addr-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--hm-soft); color: var(--hm-navy); transition: background-color 200ms, color 200ms; }
.lp-addr-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lp-addr-txt b { font-size: 14px; font-weight: 700; }
.lp-addr-txt small { font-size: 12.5px; color: var(--hm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #b8c6d0; display: grid; place-items: center; transition: border-color 200ms; }
.lp-radio i { width: 10px; height: 10px; border-radius: 50%; background: var(--hm-blue); transform: scale(0); transition: transform 320ms var(--hm-spring); }
.lp-on { border-color: var(--hm-blue); background: #f1f8fc; }
.lp-on .lp-addr-ic { background: var(--hm-blue); color: #fff; }
.lp-on .lp-radio { border-color: var(--hm-blue); }
.lp-on .lp-radio i { transform: scale(1); }
.lp-add { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; border: 0; background: none; padding: 4px 0; font-size: 14px; font-weight: 700; color: var(--hm-blue) !important; }

@keyframes lp-open { from { opacity: 0; transform: translateY(-8px) scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes lp-close { to { opacity: 0; transform: translateY(-6px) scale(0.95); } }
@keyframes lp-sheet { from { transform: translateY(100%); } to { transform: none; } }
@keyframes lp-sheet-out { to { transform: translateY(100%); } }
@keyframes lp-fade-out { to { opacity: 0; } }
@keyframes lp-drop { 0% { opacity: 0; transform: translateY(-46px); } 60% { opacity: 1; transform: translateY(3px); } 100% { transform: none; } }
@keyframes lp-shadow { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: none; } }
@keyframes lp-hop { from { transform: translateY(0); } to { transform: translateY(-10px); } }
@keyframes lp-ring { 0% { opacity: 0.9; transform: scale(0.6); } 100% { opacity: 0; transform: scale(4.2); } }
@keyframes lp-radar { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes lp-dash { to { stroke-dashoffset: -24; } }
@keyframes lp-roll { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes lp-bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes si-shake-lp { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes ct-spin { to { transform: rotate(360deg); } }

@media (max-width: 560px) {
  .hm-loc-txt b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; }
  .hm-gal-dots { bottom: 34px; padding: 3px 5px; }
  .hm-gal-dots button { width: 5px; height: 5px; }
  .hm-gal-dots button.hm-on { width: 13px; }
}
@media (prefers-reduced-motion: reduce) {
